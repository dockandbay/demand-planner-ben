<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/hz-health.js?v=__APP_VERSION__" data-hz-src="client_portal" data-hz-ver="__APP_VERSION__"></script><!-- v28.159 (Ben): browser health capture -> /api/cp/health/client-events (csid session) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dock &amp; Bay — Client Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
  /* v28.008 (Ben): CLIENT PORTAL shell — "Showroom" direction (approved 28-Sep-2026): image-led catalogue, calm warm neutrals,
     serif display headings; the ORDER flow is the Workbench stepped form (Lines → Delivery → Review) with a side cart; the
     LINE SHEET has two views (table by default, cards on toggle). Tokens fall back when /hz-theme.css does not load. */
  :where(:root){
    --font:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --nav:#0d1626;--ink:#101828;--ink-soft:#344054;--muted:#5b6b83;--faint:#8b98ad;
    --blue:#2361d8;--blue-soft:#eaf1fd;--blue-ink:#1a4fb5;--pos:#118a4e;--pos-bg:#e8f6ee;--neg:#d23227;--neg-bg:#fdeeec;--amber:#b45309;--amber-bg:#fdf3d7;--violet:#7048c9;--violet-bg:#f1ebfc;
  }
  :root{ --disp:"Fraunces","Iowan Old Style",Georgia,serif; --cp-bg:#fbfaf7; --cp-card:#fff; --cp-hover:#f5f2ec; --cp-line:#e8e3da; --cp-line2:#f0ece4; --cp-band:#f3efe7; --cp-acc:#0f6f6a; --cp-acc-soft:#e3f1ef; --cp-acc-ink:#0b5652; --cp-sand:#e9c46a; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--cp-bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--cp-acc)}
  /* header */
  header.cp-top{display:flex;align-items:center;gap:18px;padding:0 24px;height:62px;background:var(--cp-card);border-bottom:1px solid var(--cp-line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .cp-brand{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.01em;white-space:nowrap;color:var(--ink);text-decoration:none}
  .cp-brand small{display:block;font-family:var(--font);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:-3px}
  nav.cp-nav{display:flex;gap:4px;margin-left:6px;overflow-x:auto;scrollbar-width:none} nav.cp-nav::-webkit-scrollbar{display:none}
  .cp-nl{padding:8px 13px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;border:0;background:transparent;font-family:inherit;white-space:nowrap;position:relative;text-decoration:none}
  .cp-nl.active{background:var(--ink);color:var(--cp-card)}
  .cp-nl .cnt{position:absolute;top:1px;right:2px;background:var(--neg);color:#fff;font-size:9px;font-weight:800;padding:0 5px;border-radius:999px}
  .cp-who{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);white-space:nowrap;line-height:1.3} .cp-who b{display:block;color:var(--ink)}
  .cp-av{width:34px;height:34px;border-radius:999px;background:var(--cp-acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;cursor:pointer}
  main#cp{padding:22px 24px 70px;max-width:1300px;margin:0 auto}
  h1.cp-h{font-family:var(--disp);font-weight:500;font-size:28px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance} .cp-lead{color:var(--muted);margin:0 0 16px;max-width:72ch}
  .cp-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .cp-in{height:34px;padding:0 12px;border:1px solid var(--cp-line);border-radius:8px;background:var(--cp-card);color:var(--ink);font-family:inherit;font-size:13px;max-width:100%}
  .cp-chip{padding:6px 12px;font-size:12px;font-weight:600;border:1px solid var(--cp-line);border-radius:999px;background:var(--cp-card);color:var(--ink-soft);cursor:pointer;white-space:nowrap} .cp-chip.active{background:var(--cp-acc);border-color:var(--cp-acc);color:#fff}
  .cp-seg{display:inline-flex;border:1px solid var(--cp-line);border-radius:8px;overflow:hidden;background:var(--cp-card)} .cp-seg span{padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-right:1px solid var(--cp-line);white-space:nowrap} .cp-seg span:last-child{border-right:0} .cp-seg span.on{background:var(--cp-acc-soft);color:var(--cp-acc-ink)}
  .cp-btn{min-height:34px;padding:7px 14px;font-size:13px;font-weight:600;border:1px solid var(--cp-line);border-radius:8px;background:var(--cp-card);color:var(--ink);cursor:pointer;font-family:inherit;white-space:nowrap} .cp-btn.acc{background:var(--cp-acc);border-color:var(--cp-acc);color:#fff} .cp-btn.ink{background:var(--ink);border-color:var(--ink);color:var(--cp-card)} .cp-btn:disabled{opacity:.5;cursor:default} .cp-btn.sm{min-height:28px;padding:4px 10px;font-size:12px}
  .cp-card{background:var(--cp-card);border:1px solid var(--cp-line);border-radius:12px;padding:16px 18px;margin-bottom:14px} .cp-card.flush{padding:0;overflow:hidden}
  .cp-card h3{margin:0 0 8px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap} .cp-card h3 .mut{font-weight:400}
  .tw{overflow-x:auto} table.cp{border-collapse:collapse;width:100%;font-size:13px} table.cp th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--cp-line);white-space:nowrap;background:var(--cp-band);position:sticky;top:0} table.cp td{padding:9px 10px;border-bottom:1px solid var(--cp-line2);white-space:nowrap;vertical-align:middle} table.cp tr:hover td{background:var(--cp-hover)}
  .num{text-align:right;font-variant-numeric:tabular-nums} .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap} .b-g{background:var(--pos-bg);color:var(--pos)} .b-r{background:var(--neg-bg);color:var(--neg)} .b-a{background:var(--amber-bg);color:var(--amber)} .b-b{background:var(--cp-acc-soft);color:var(--cp-acc-ink)} .b-n{background:var(--cp-band);color:var(--muted)} .b-v{background:var(--violet-bg);color:var(--violet)}
  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px} .stat div{background:var(--cp-card);border:1px solid var(--cp-line);border-radius:12px;padding:14px 16px} .stat b{display:block;font-family:var(--disp);font-size:26px;font-weight:500} .stat span{font-size:12px;color:var(--muted)}
  .hero{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:center;background:var(--cp-card);border:1px solid var(--cp-line);border-radius:16px;padding:22px 24px;margin-bottom:18px} .hero .ph{aspect-ratio:16/9;border-radius:12px;background:linear-gradient(140deg,#cfe0ea,#3b4a70);background-size:cover;background-position:center} .hero .eyebrow{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .orow{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--cp-line);border-radius:12px;background:var(--cp-card);margin-bottom:8px} .orow .ref{font-weight:700} .orow .sub{font-size:12px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .pc{background:var(--cp-card);border:1px solid var(--cp-line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column} .pc .ph{aspect-ratio:4/3;background:linear-gradient(160deg,#e9e2d3,#cdbfa4) center/cover no-repeat;position:relative} .pc .tag{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);color:var(--ink);font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px} .pc .tag.new{background:var(--cp-sand)} .pc .tag.disc{background:var(--amber-bg);color:var(--amber)}
  .pc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1} .pc .nm{font-weight:600;line-height:1.3} .pc .sku{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace} .pc .meta{font-size:11px;color:var(--muted)} .pc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;gap:6px}
  .price{font-weight:700} .band{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--pos-bg);color:var(--pos)} .band.low{background:var(--neg-bg);color:var(--neg)} .band.mid{background:var(--amber-bg);color:var(--amber)}
  .sw{display:inline-block;width:12px;height:12px;border-radius:999px;vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.08)}
  .qty{width:70px;height:30px;text-align:right;border:1px solid var(--cp-line);border-radius:8px;background:var(--cp-card);color:var(--ink);font-family:inherit;padding:0 8px}
  .steps{display:flex;gap:0;margin-bottom:12px;border:1px solid var(--cp-line);border-radius:10px;overflow:hidden;background:var(--cp-card)} .steps div{flex:1;padding:9px 12px;font-size:12px;font-weight:600;color:var(--muted);border-right:1px solid var(--cp-line);display:flex;gap:8px;align-items:center;cursor:pointer} .steps div:last-child{border-right:0} .steps div.on{background:var(--cp-acc-soft);color:var(--cp-acc-ink)} .steps i{width:18px;height:18px;border-radius:999px;background:var(--cp-band);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:800} .steps div.on i{background:var(--cp-acc);color:#fff} .steps div.done i{background:var(--pos);color:#fff}
  .three{display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:start} .two{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
  .cart{position:sticky;top:76px} .cart .row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--cp-line2);font-size:12.5px} .cart .tot{font-weight:800;font-size:14px;border-top:2px solid var(--cp-line);margin-top:6px;padding-top:8px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:12.5px;align-items:center} .kv b{font-weight:600;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
  .cat{background:var(--cp-band);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
  .warn{color:var(--amber);font-weight:700;font-size:11px} .ok{color:var(--pos);font-weight:700;font-size:11px}
  .thread{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--cp-line2);cursor:pointer;border-radius:8px} .thread.on{background:var(--cp-acc-soft)}
  .msg{max-width:78%;padding:10px 13px;border-radius:14px;font-size:13px;margin-bottom:8px;background:var(--cp-band);white-space:pre-wrap;word-break:break-word} .msg.me{margin-left:auto;background:var(--cp-acc-soft);color:var(--cp-acc-ink)} .msg .who2{font-size:11px;color:var(--muted);margin-bottom:3px;white-space:nowrap}
  .att{display:inline-block;border:1px solid var(--cp-line);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--muted);margin:4px 4px 0 0;background:var(--cp-card)}
  .mut{color:var(--muted)} .faint{color:var(--faint)} .tiny{font-size:12px}
  .tl{display:flex;gap:0;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap} .tl i{width:10px;height:10px;border-radius:999px;background:var(--cp-line);display:inline-block;margin:0 4px} .tl i.on{background:var(--pos)} .tl i.now{background:var(--cp-acc);box-shadow:0 0 0 3px var(--cp-acc-soft)}
  .imgcell{width:38px;height:38px;border-radius:8px;background:linear-gradient(135deg,#e9e2d3,#cdbfa4) center/cover no-repeat;display:inline-block;vertical-align:middle}
  /* login */
  .cp-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .cp-lcard{background:var(--cp-card);border:1px solid var(--cp-line);border-radius:16px;box-shadow:0 12px 40px rgba(16,24,40,.08);padding:34px 36px;width:400px;max-width:100%;text-align:center}
  .cp-lcard h1{font-family:var(--disp);font-weight:500;font-size:26px;margin:2px 0 6px} .cp-lcard p{color:var(--muted);margin:0 0 18px}
  .cp-lcard input{width:100%;height:42px;padding:0 14px;border:1px solid var(--cp-line);border-radius:10px;font-size:15px;margin-bottom:10px;font-family:inherit}
  #cp-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;transition:.2s;z-index:50;max-width:92vw} #cp-toast.on{opacity:1;transform:translateX(-50%)} #cp-toast.err{background:var(--neg)}
  @media (max-width:820px){ .three,.two,.hero{grid-template-columns:1fr} .orow{grid-template-columns:1fr 1fr} main#cp{padding:16px 16px 60px} header.cp-top{padding:0 14px;gap:10px} .cp-who{display:none} .cart{position:static} }
  @media (prefers-reduced-motion:reduce){*{transition:none}}
</style>
</head>
<body>
<div id="cp-root"><div class="cp-login"><div class="cp-lcard" data-hz-loading="1"><div class="tiny mut" style="letter-spacing:.14em;text-transform:uppercase;font-weight:700">Dock &amp; Bay</div><h1>Client portal</h1><p>Loading…</p></div></div></div>
<div id="cp-toast" role="status"></div>
<script>window.CP_VERSION='__APP_VERSION__';</script>
<script src="/client-view.js?v=__APP_VERSION__"></script><!-- v28.195 (Ben): the boot card carries data-hz-loading, so hz-health.js times the first screen until /me + the first view have rendered -->
</body>
</html>
