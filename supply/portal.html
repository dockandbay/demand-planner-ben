<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dock &amp; Bay — Supplier Portal</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0f172a;background:#fff;font-size:13px}
  header.pv-top{background:#0f172a;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
  header.pv-top h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#cbd5e1;margin:0;font-weight:700}
  header.pv-top .sup{font-size:15px;font-weight:700}
  header.pv-top .sp{flex:1}
  .pv-btn{border:0;border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:13px;background:#2563eb;color:#fff}
  .pv-btn.ghost{background:transparent;color:#cbd5e1;border:1px solid #475569}
  .pp-inbox-lbl{display:none}                        /* "Inbox" word: desktop only */
  @media (min-width:641px){ .pp-inbox-lbl{display:inline} }
  #pv-wrap{padding:14px 16px}   /* full-width (was boxed to 1100px, leaving empty margins on larger screens) */
  /* PO table was leaving a dead strip at the bottom. portal-view.js injects "#supply-root .tw{max-height:calc(100vh-210px)}"
     AFTER this style, so a plain "#pv-wrap .tw" loses on equal specificity + load order — the double-ID selector wins. */
  #pv-wrap #supply-root .tw{max-height:calc(100vh - 160px)}
  .pv-login{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .pv-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 8px 30px rgba(15,23,42,.06);padding:34px 36px;width:380px;max-width:92vw;text-align:center}
  .pv-card h1{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#64748b;margin:0 0 2px}
  .pv-card h2{font-size:21px;margin:0 0 6px}
  .pv-card p{color:#64748b;margin:0 0 18px}
  .pv-card input{width:100%;padding:11px 13px;border:1px solid #e5e7eb;border-radius:9px;font-size:15px;margin-bottom:12px}
  .pv-card .pv-btn{width:100%}
  .pv-msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:8px}
  .pv-msg.ok{background:#ecfdf5;color:#15803d;border:1px solid #bbf7d0}
  .pv-empty{padding:30px;text-align:center;color:#64748b}
</style>
</head>
<body>
<div id="root"><div class="pv-empty">Loading…</div></div>
<script>
(function(){
  var root=document.getElementById('root');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function api(p,b){ return fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(function(r){return r.json();}); }
  function get(p){ return fetch(p).then(function(r){ if(r.status===401) throw {auth:true}; return r.json(); }); }

  function showLogin(){
    var expired=/[?&]e=expired/.test(location.search);
    root.innerHTML='<div class="pv-login"><form class="pv-card" id="lf">'
      +'<h1>Dock &amp; Bay</h1><h2>Supplier Portal</h2>'
      +'<p>Enter your email and we\'ll send you a secure sign-in link.</p>'
      +'<input id="email" type="email" placeholder="you@supplier.com" autocomplete="email" autofocus required>'
      +'<button class="pv-btn" type="submit">Email me a link</button>'
      +(expired?'<div class="pv-msg ok">That link expired — request a new one above.</div>':'')
      +'<div id="lmsg"></div></form></div>';
    document.getElementById('lf').addEventListener('submit',function(e){ e.preventDefault();
      var email=document.getElementById('email').value.trim(), btn=e.target.querySelector('button'), m=document.getElementById('lmsg');
      if(!email)return; btn.disabled=true; btn.textContent='Sending…';
      api('/api/portal/request-link',{email:email}).then(function(){
        m.className='pv-msg ok'; m.innerHTML='If <b>'+esc(email)+'</b> is registered, a sign-in link is on its way. Check your inbox (valid 7 days).'; btn.textContent='Link sent';
      }).catch(function(){ m.className='pv-msg ok'; m.textContent='If that email is registered, a link is on its way.'; btn.disabled=false; btn.textContent='Email me a link'; });
    });
  }

  var EP={ lineCost:'/api/portal/line-cost', lineRemove:'/api/portal/line-remove', crossdockQty:'/api/portal/crossdock-qty',
    addlCost:'/api/portal/additional-cost', addlCostRemove:'/api/portal/additional-cost-remove', note:'/api/portal/note',
    notesBase:'/api/portal/notes/', noteReadBase:'/api/portal/note-read/', escalate:'/api/portal/escalate', submit:'/api/portal/submit', upload:'/api/portal/upload',
    labelData:'/api/portal/label-data', shipsWith:'/api/portal/ships-with/',
    shipmentInvoice:'/api/portal/invoice/shipment/', poInvoice:'/api/portal/invoice/po/',
    sampleAccept:'/api/portal/sample-accept', sampleUpdate:'/api/portal/sample-update', sampleNote:'/api/portal/sample-note',
    sampleNotesBase:'/api/portal/sample-notes/', sampleNoteReadBase:'/api/portal/sample-note-read/', sampleCharge:'/api/portal/sample-charge', sampleCreate:'/api/portal/sample-create',
    attachmentBase:'/api/portal/attachment/', sampleAttachment:'/api/portal/sample-attachment', sampleAttachmentRemove:'/api/portal/sample-attachment-remove',
    shipmentCharge:'/api/portal/shipment-charge', shipmentChargesBase:'/api/portal/shipment-charges/', shipmentUpdate:'/api/portal/shipment/',
    shipmentNotesBase:'/api/portal/shipment-notes/', shipmentNote:'/api/portal/shipment-note', shipmentNotesRead:'/api/portal/shipment-notes-read',
    dtcAccept:'/api/portal/dtc-accept', docSubmit:'/api/portal/doc-submit', recentActivity:'/api/portal/recent-activity', unreadMessages:'/api/portal/unread-messages',
    productNotesBase:'/api/portal/product-notes/', productNote:'/api/portal/product-note', productNotesRead:'/api/portal/product-notes-read', productSwatchBase:'/api/product/swatch/',
    productSamplesBase:'/api/portal/product-samples/', productSample:'/api/portal/product-sample', productSamplePhoto:'/api/portal/product-sample-photo', attachImgBase:'/api/supply/portal-attachment/',
    productDoc:'/api/portal/product-doc', productItemBase:'/api/product/item/',
    productOpenSamples:'/api/portal/product-open-samples', productSkus:'/api/portal/product-skus', sampleContentsBase:'/api/portal/sample/',
    specApprove:'/api/portal/spec-approve', specFileBase:'/api/portal/spec-file/' };

  // Anonymise mode (for screenshots only): ?anon=1 → header "ACME Inc" + PO supplier codes shown as CM; ?as=Name
  // sets a custom name; ?anon=0 turns it off. Sticky via localStorage. Display only — data & filtering unchanged.
  (function(){ try{ var q=new URLSearchParams(location.search||'');
    if(q.has('anon')||q.has('as')){ var v=q.get('as'); if(v==null) v=(q.get('anon')==='0'?'':'ACME Inc');
      if(v) localStorage.setItem('pp_anon_name', v); else localStorage.removeItem('pp_anon_name'); } }catch(e){} })();
  var ANON_NAME=(function(){ try{ return localStorage.getItem('pp_anon_name')||''; }catch(e){ return ''; } })();
  function showPortal(me){
    var realSup=(me.suppliers||[]).join(', ')||'Supplier';
    var sup=ANON_NAME||realSup;
    root.innerHTML='<header class="pv-top"><h1>Dock &amp; Bay</h1><span class="sup">'+esc(sup)+'</span><span class="sp"></span>'
      +(me.price_list_enabled?'<button class="pv-btn ghost" id="pv-pl-btn" style="margin-right:10px">💲 Price List</button>':'')
      +'<span style="font-size:10px;opacity:.5;margin-right:10px" title="app version — tell Ben this if something looks stale">__APP_VERSION__</span>'
      +'</header><div id="pv-wrap"><div id="pv"></div></div>';   // Sign out removed — sessions expire on their own
    var _plb=document.getElementById('pv-pl-btn'); if(_plb)_plb.onclick=function(){ ppPriceList(me); };
    var s=document.createElement('script'); s.src='/portal-view.js?v='+Date.now();   // cache-bust: always fetch the latest portal-view.js (tunnels/proxies were serving stale CSS + JS)
    s.onload=function(){
      window.DBPortalView.mount({
        root: document.getElementById('pv'),
        ep: EP, by: me.email, sid: null, supplierName: realSup,
        anon: ANON_NAME ? {name:ANON_NAME, realNames:(me.suppliers||[])} : null,
        getData: function(){ return fetch('/api/portal/bootstrap'+(window.__ppInclArch?'?includeArchived=1':'')).then(function(r){return r.json();}).then(function(j){ if(j&&j.error)throw new Error(j.error); return j; }); }
      });
    };
    s.onerror=function(){ document.getElementById('pv').innerHTML='<div class="pv-empty">Could not load the portal view.</div>'; };
    document.body.appendChild(s);
  }

  // ── Supplier Price List (gated: only shown when the server enables it) ──
  function ppPriceList(me){ var ex=document.getElementById('pv-pl-ov'); if(ex)ex.remove();
    var _prods=[];
    function CCY(c){ return ({USD:'$',GBP:'£',EUR:'€',AUD:'A$',CAD:'C$'})[String(c||'').toUpperCase()]||''; }
    function tierStr(e){ if(!e.tiers||!e.tiers.length)return '—'; var sym=CCY(e.currency); return e.tiers.map(function(t){return t.min_qty+'+ : '+sym+(+t.unit_cost).toFixed(2);}).join('   ·   '); }
    var ov=document.createElement('div'); ov.id='pv-pl-ov'; ov.style.cssText='position:fixed;inset:0;z-index:9000;background:#fff;overflow:auto';
    ov.innerHTML='<header class="pv-top"><h1>Dock &amp; Bay</h1><span class="sup">Price List</span><span class="sp"></span><button class="pv-btn ghost" id="pl-back">← Back</button></header><div id="pv-wrap"><div id="pl-body"><div class="pv-empty">Loading…</div></div></div>';
    document.body.appendChild(ov);
    document.getElementById('pl-back').onclick=function(){ ov.remove(); };
    function load(){ get('/api/portal/price-list').then(render).catch(function(e){ document.getElementById('pl-body').innerHTML='<div class="pv-empty">Could not load price list.</div>'; }); }
    function render(d){ var b=document.getElementById('pl-body'); var ents=d.entries||[]; _prods=d.productions||[];
      var active=ents.filter(function(e){return e.status==='active';}), pending=ents.filter(function(e){return e.status==='pending';});
      var html='<div style="max-width:840px"><p style="color:#64748b">Your current prices. Propose a change and we’ll review and approve it. Larger quantities must be a lower unit cost.</p>';
      if(pending.length){ html+='<div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:10px 12px;margin-bottom:14px"><b>⏳ Awaiting approval</b>'+pending.map(function(e){return '<div style="font-size:12px;margin-top:4px">'+esc(e.scope==='type'?e.price_type:e.sku)+(e.effective_from_production?(' <span style="color:#92400e">from prod '+e.effective_from_production+'</span>'):'')+' → '+tierStr(e)+'</div>';}).join('')+'</div>'; }
      if(!active.length)html+='<div class="pv-empty">No prices on file yet.</div>';
      active.forEach(function(e,i){ html+='<div style="border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin-bottom:8px">'
        +'<div style="font-weight:700">'+esc(e.scope==='type'?('Price type: '+e.price_type):('SKU: '+e.sku))+' <span style="color:#94a3b8;font-weight:400;font-size:12px">('+esc(e.currency)+')</span></div>'
        +'<div style="color:#334155;font-size:13px;margin-top:3px">Current: '+tierStr(e)+'</div>'
        +'<button class="pv-btn pl-prop" data-i="'+i+'" style="margin-top:8px;padding:5px 12px;font-size:12px">Propose change</button>'
        +'<div class="pl-form" data-i="'+i+'" style="display:none;margin-top:8px"></div></div>'; });
      html+='</div>'; b.innerHTML=html;
      b.querySelectorAll('.pl-prop').forEach(function(btn){ btn.onclick=function(){ openForm(active[+btn.dataset.i], b.querySelector('.pl-form[data-i="'+btn.dataset.i+'"]')); }; });
    }
    function openForm(e, host){ if(host.style.display!=='none'){ host.style.display='none'; host.innerHTML=''; return; } host.style.display='';
      var sym=CCY(e.currency), tiers=(e.tiers&&e.tiers.length?e.tiers.map(function(t){return {min_qty:t.min_qty,unit_cost:t.unit_cost};}):[{min_qty:1,unit_cost:''}]);
      var prodOpts='<option value="">Now (current price)</option>'+_prods.map(function(p){return '<option value="'+p+'">from production '+p+'</option>';}).join('');
      function readT(){ tiers=[]; host.querySelectorAll('.pl-tr').forEach(function(r){ tiers.push({min_qty:r.querySelector('.pl-mq').value,unit_cost:r.querySelector('.pl-uc').value}); }); if(!tiers.length)tiers=[{min_qty:1,unit_cost:''}]; }
      function draw(){ host.innerHTML='<div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px">'
        +'<div style="font-size:12px;color:#475569;margin-bottom:7px">Applies from: <select class="pl-efp" style="padding:4px 7px;border:1px solid #cbd5e1;border-radius:5px">'+prodOpts+'</select></div>'
        +'<div class="pl-tiers">'+tiers.map(function(t,ti){return '<div class="pl-tr" style="display:flex;gap:6px;align-items:center;margin-bottom:5px"><span style="color:#64748b;width:30px">min</span><input class="pl-mq" type="number" min="1" value="'+esc(t.min_qty)+'" style="width:82px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:5px"><span style="color:#64748b">qty → '+sym+'</span><input class="pl-uc" type="number" step="0.0001" value="'+esc(t.unit_cost)+'" style="width:100px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:5px">'+(tiers.length>1?'<button class="pl-trx" data-ti="'+ti+'" style="border:none;background:none;color:#b91c1c;cursor:pointer;font-size:15px">✕</button>':'')+'</div>';}).join('')+'</div>'
        +'<button class="pl-addtier" style="font-size:12px;padding:2px 9px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;cursor:pointer">+ tier</button>'
        +'<div class="pl-err" style="color:#b91c1c;font-size:12px;font-weight:600;min-height:14px;margin-top:6px"></div>'
        +'<div style="text-align:right"><button class="pl-submit pv-btn" style="padding:6px 14px">Submit for approval</button></div></div>';
        host.querySelectorAll('.pl-trx').forEach(function(x){x.onclick=function(){readT();tiers.splice(+x.dataset.ti,1);if(!tiers.length)tiers=[{min_qty:1,unit_cost:''}];draw();};});
        host.querySelector('.pl-addtier').onclick=function(){readT();tiers.push({min_qty:'',unit_cost:''});draw();};
        host.querySelector('.pl-submit').onclick=function(){ readT(); var err=host.querySelector('.pl-err');
          var ts=tiers.map(function(t){return {min_qty:parseInt(t.min_qty,10)||1,unit_cost:Number(t.unit_cost)};}).filter(function(t){return isFinite(t.unit_cost)&&String(t.unit_cost)!=='';});
          if(!ts.length){err.textContent='Enter at least one price.';return;} ts.sort(function(a,b){return a.min_qty-b.min_qty;});
          for(var i=1;i<ts.length;i++){ if(ts[i].min_qty===ts[i-1].min_qty){err.textContent='Two tiers have the same min quantity.';return;} if(ts[i].unit_cost>ts[i-1].unit_cost+1e-9){err.textContent='Larger quantity must be a lower unit cost.';return;} }
          var sb=host.querySelector('.pl-submit'); sb.disabled=true; sb.textContent='Submitting…';
          api('/api/portal/price-list/submit',{supplier:e.supplier,scope:e.scope,price_type:e.price_type,sku:e.sku,currency:e.currency,effective_from_production:host.querySelector('.pl-efp').value,tiers:ts}).then(function(j){ if(j&&j.error){sb.disabled=false;sb.textContent='Submit for approval';err.textContent=j.error;return;} load(); }).catch(function(){sb.disabled=false;sb.textContent='Submit for approval';err.textContent='Could not submit.';}); };
      }
      draw();
    }
    load();
  }

  get('/api/portal/me').then(showPortal).catch(function(){ showLogin(); });
})();
// ── Silent auto-update (supplier portal) ── mirrors the main app: reload on a new deploy or a >30-min stale
// session, silently when backgrounded/idle, else a small Refresh nudge.
(function(){
  var BOOT='__APP_VERSION__'; if(!/^v?\d/.test(BOOT))return;
  var pending=false,nagShown=false,nagMsg='A new version is ready.',lastAct=Date.now(),STALE_MS=30*60*1000,IDLE_MS=90*1000;
  ['mousemove','keydown','mousedown','scroll','touchstart'].forEach(function(ev){window.addEventListener(ev,function(){lastAct=Date.now();},{passive:true,capture:true});});
  function nag(){ if(nagShown||!document.body)return; nagShown=true; var d=document.createElement('div');
    d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2147483000;background:#fde047;color:#111827;font:700 15px system-ui;padding:11px 18px;display:flex;gap:16px;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(0,0,0,.28);border-bottom:2px solid #eab308';
    d.innerHTML='<span style="font-size:16px">🔄 '+nagMsg+'</span><button id="hz-pu-go" style="background:#111827;color:#fde047;border:0;border-radius:6px;padding:8px 18px;font-weight:700;font-size:14px;cursor:pointer">Refresh now</button>';
    document.body.appendChild(d); document.getElementById('hz-pu-go').onclick=function(){location.reload();}; }
  function apply(){ if(!pending)return; if(document.hidden){location.reload();return;} if(Date.now()-lastAct>IDLE_MS){location.reload();return;} nag(); }
  function check(){ fetch('/api/version',{cache:'no-store',credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(j){ if(j&&j.version&&j.version!==BOOT){pending=true;apply();} }).catch(function(){}); }
  document.addEventListener('visibilitychange',function(){ if(document.hidden){apply();}else{lastAct=Date.now();check();} });
  window.addEventListener('focus',function(){lastAct=Date.now();check();});
  setInterval(check,5*60*1000); setInterval(function(){if(pending)apply();},30*1000); setTimeout(check,15000);
  setTimeout(function(){ if(!pending){pending=true;nagMsg='This session has been open a while — refreshing to stay current.';} apply(); },STALE_MS);
})();
</script>
</body>
</html>
