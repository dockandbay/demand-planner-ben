<style>
  /* v27.668 (Ben): FALLBACK design tokens baked into the portal shell so it renders correctly even when the
     external /hz-theme.css stylesheet doesn't reach the portal (e.g. the theme <link> not injected on the live
     portal → var(--pos)/var(--blue) buttons rendered WHITE — Confirm order, Add attachment, etc.). :where(:root)
     has ZERO specificity, so when hz-theme.css DOES load its own :root wins and there is no drift; when it does
     not, these apply. Values mirror the light palette in supply/hz-theme.css. */
  :where(:root){
    --nav:#0d1626;--nav-2:#16213a;--nav-ink:#e7edf7;--nav-dim:#93a1b8;
    --bg:#f4f6f9;--card:#ffffff;--hover:#f7f9fc;--line:#e5e9f0;--line2:#eef1f6;
    --ink:#101828;--ink-soft:#344054;--muted:#5b6b83;--faint:#8b98ad;
    --blue:#2361d8;--blue-soft:#eaf1fd;--blue-ink:#1a4fb5;
    --pos:#118a4e;--pos-bg:#e8f6ee;--pos-bd:#bfe3cd;
    --neg:#d23227;--neg-bg:#fdeeec;--neg-cell:#fbdcd8;--neg-bd:#f5c6c2;
    --amber:#b45309;--amber-bg:#fdf3d7;--prod:#f5b83d;--prod-bg:#fdeec8;
    --violet:#7048c9;--violet-bg:#f1ebfc;--l3-bg:#f0f6ff;
    --r-sm:8px;--r-md:10px;--r-lg:12px;--r-xl:14px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 22px -12px rgba(16,24,40,.10);
    --font:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --row-alt:#f6f8fb;--hdr-tint:#f3f4f6;--hdr-cur:#eef2f9;
  }
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0f172a;background:#fff;font-size:13px}
  header.pv-top{background:#0f172a;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;row-gap:6px}
  header.pv-top h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#cbd5e1;margin:0;font-weight:700}
  header.pv-top .sup{font-size:15px;font-weight:700}
  header.pv-top .sp{flex:1}
  /* HORIZON brand mark (reuses the main-app sunset logo) */
  /* v27.801 (Ben): brand is a column: logo + HORIZON on top, the app version in tiny type directly beneath the logo. */
  header.pv-top .pv-brand{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;font-weight:800;letter-spacing:.13em;font-size:13px;color:#fff}
  header.pv-top .pv-brand-row{display:inline-flex;align-items:center;gap:7px}
  header.pv-top .pv-brand svg{display:block;flex:0 0 auto}
  header.pv-top .pv-div{width:1px;height:20px;background:#334155;flex:0 0 auto}
  header.pv-top .pv-ver{font-size:9px;opacity:.55;line-height:1;letter-spacing:.04em;font-weight:500}
  /* level-1 section menu, moved up into the dark bar (white text) */
  header.pv-top #pp-secs{display:flex;gap:2px;align-items:center;flex-wrap:wrap;background:none;border:0;margin:0;padding:0;overflow:visible}
  header.pv-top #pp-secs .pp-sec{padding:4px 9px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#cbd5e1;cursor:pointer;white-space:nowrap;border-radius:7px;transition:background .15s,color .15s}
  header.pv-top #pp-secs .pp-sec:hover{color:#fff;background:rgba(255,255,255,.09)}
  header.pv-top #pp-secs .pp-sec.active{color:#0f172a;background:#fff}
  header.pv-top #pp-secs .pp-sec-n{display:inline-block;margin-left:4px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;line-height:1.4;padding:1px 7px;border-radius:999px;vertical-align:middle;letter-spacing:0}
  .pv-btn{border:0;border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:13px;background:#2563eb;color:#fff}
  .pv-btn.ghost{background:transparent;color:#cbd5e1;border:1px solid #475569}
  .pp-inbox-lbl{display:none}                        /* "Inbox" word: desktop only */
  @media (min-width:641px){ .pp-inbox-lbl{display:inline} }
  #pv-wrap{padding:0 16px 14px}   /* full-width; top padding 0 so the grey L2 tab band sits flush under the dark L1 brand bar (v27.639) */
  /* PO table was leaving a dead strip at the bottom. portal-view.js injects "#supply-root .tw{max-height:calc(100vh-210px)}"
     AFTER this style, so a plain "#pv-wrap .tw" loses on equal specificity + load order — the double-ID selector wins. */
  #pv-wrap #supply-root .tw{max-height:calc(100vh - 160px)}
  .pv-login{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .pv-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 8px 30px rgba(15,23,42,.06);padding:34px 36px;width:380px;max-width:92vw;text-align:center}
  .pv-card h1{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#64748b;margin:0 0 2px}
  .pv-card h2{font-size:21px;margin:0 0 6px}
  .pv-card p{color:#64748b;margin:0 0 18px}
  .pv-card input{width:100%;padding:11px 13px;border:1px solid #e5e7eb;border-radius:9px;font-size:15px;margin-bottom:12px}
  .pv-card .pv-btn{width:100%}
  .pv-msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:8px}
  .pv-msg.ok{background:#ecfdf5;color:#15803d;border:1px solid #bbf7d0}
  .pv-empty{padding:30px;text-align:center;color:#64748b}
</style>
</head>

<div id="root"><div class="pv-empty">Loading…</div></div>
<script>
(function(){
  var root=document.getElementById('root');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function api(p,b){ if(p.indexOf('/price-list/')>=0)window.__plData=null;   // a price-list write invalidates the client cache (v27.505)
    return fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(function(r){return r.json();}); }
  function get(p){ return fetch(p).then(function(r){ if(r.status===401) throw {auth:true}; return r.json(); }); }

  function showLogin(){
    var expired=/[?&]e=expired/.test(location.search);
    root.innerHTML='<div class="pv-login"><form class="pv-card" id="lf">'
      +'<h1>Dock &amp; Bay</h1><h2>Supplier Portal</h2>'
      +'<p>Enter your email and we\'ll send you a secure sign-in link.</p>'
      +'<input id="email" type="email" placeholder="you@supplier.com" autocomplete="email" autofocus required>'
      +'<button class="pv-btn" type="submit">Email me a link</button>'
      +(expired?'<div class="pv-msg ok">That link expired — request a new one above.</div>':'')
      +'<div id="lmsg"></div></form></div>';
    document.getElementById('lf').addEventListener('submit',function(e){ e.preventDefault();
      var email=document.getElementById('email').value.trim(), btn=e.target.querySelector('button'), m=document.getElementById('lmsg');
      if(!email)return; btn.disabled=true; btn.textContent='Sending…';
      api('/api/portal/request-link',{email:email}).then(function(){
        m.className='pv-msg ok'; m.innerHTML='If <b>'+esc(email)+'</b> is registered, a sign-in link is on its way. Check your inbox (valid 7 days).'; btn.textContent='Link sent';
      }).catch(function(){ m.className='pv-msg ok'; m.textContent='If that email is registered, a link is on its way.'; btn.disabled=false; btn.textContent='Email me a link'; });
    });
  }

  var EP={ signUpload:'/api/portal/storage/sign-upload', lineCost:'/api/portal/line-cost', lineRemove:'/api/portal/line-remove', crossdockQty:'/api/portal/crossdock-qty',
    addlCost:'/api/portal/additional-cost', addlCostRemove:'/api/portal/additional-cost-remove', note:'/api/portal/note',
    notesBase:'/api/portal/notes/', noteReadBase:'/api/portal/note-read/', escalate:'/api/portal/escalate', submit:'/api/portal/submit', upload:'/api/portal/upload',
    labelData:'/api/portal/label-data', shipsWith:'/api/portal/ships-with/',

    function upload(kind,file,certKey){ if(!file)return; if(file.size>20*1024*1024){ toast('File over 20 MB',true); return; } var rd=new FileReader(); rd.onload=function(){ var b64=String(rd.result).replace(/^data:[^;]+;base64,/,''); post('/api/portal/onboarding/upload',{kind:kind,filename:file.name,mime:file.type||'application/octet-stream',byte_size:file.size,data_base64:b64}).then(function(j){ if(kind==='bank'){ S.form.logistics.bankDocId=j.id; S.form.logistics.bankDocName=j.filename; } else { S.form.certs[certKey+'DocId']=j.id; S.form.certs[certKey+'DocName']=j.filename; } save(); render(); toast('Uploaded '+file.name); }).catch(function(e){ toast('Upload failed: '+e.message,true); }); }; rd.readAsDataURL(file); }

      if(t.length<2||mn===mx)return '<b>'+sym+mx.toFixed(2)+'</b>'; return '<span style="font-size:11px;color:#64748b">'+sym+mn.toFixed(2)+'</span> – <b style="font-size:14px">'+sym+mx.toFixed(2)+'</b>'; }

      b.innerHTML='<div style="display:flex;align-items:flex-start;gap:12px"><p style="color:#64748b;max-width:820px;flex:1;margin-top:0">Your prices. Click any price to <b>propose a change</b> — we’ll review and approve it. Larger quantities must be a lower unit cost. Expand ▸ a price type to price individual SKUs. Click 🕘 on any row for its change history.</p><button id="pl-csv" class="pv-btn ghost" style="flex:0 0 auto;color:#334155;border-color:#cbd5e1;white-space:nowrap" title="Download your full price list as Excel — a Price types sheet + a SKUs sheet, with category">Download Excel</button></div><div id="pl-notif"></div><div style="overflow:auto"><table class="pltbl"><thead>'+head+'</thead><tbody>'+bd+'</tbody></table></div>';

    function proposeModal(ctx){ var exm=document.getElementById('pl-prop-ov'); if(exm)exm.remove();
      var sym=CCY(ctx.currency), src=ctx.pend||ctx.cur, editing=!!ctx.pend, subLbl=editing?'Edit approval':'Submit for approval';

      var mv=document.createElement('div'); mv.id='pl-prop-ov'; mv.style.cssText='position:fixed;inset:0;z-index:9500;background:rgba(15,23,42,.4);display:flex;align-items:center;justify-content:center;padding:16px';

      var host=document.getElementById('pl-prop-body');
      function readT(){ tiers=[]; host.querySelectorAll('.pl-tr').forEach(function(r){ tiers.push({min_qty:r.querySelector('.pl-mq').value,unit_cost:r.querySelector('.pl-uc').value}); }); if(!tiers.length)tiers=[{min_qty:1,unit_cost:''}]; }
      function validate(){ var ok=true, msg='', err=host.querySelector('.pl-err');

        rows.forEach(function(x){ if(x.craw===''||!isFinite(x.c)){x.uc.style.borderColor='#ef4444';ok=false;if(!msg)msg='Enter a unit price for every tier.';} if(isNaN(x.q)||x.q<1){x.mq.style.borderColor='#ef4444';ok=false;if(!msg)msg='Min quantity must be at least 1.';} });
        var srt=rows.filter(function(x){return !isNaN(x.q);}).slice().sort(function(a,b){return a.q-b.q;});
        for(var i=1;i<srt.length;i++){ if(srt[i].q===srt[i-1].q){srt[i].mq.style.borderColor='#ef4444';srt[i-1].mq.style.borderColor='#ef4444';ok=false;if(!msg)msg='Two tiers have the same minimum quantity.';} else if(isFinite(srt[i].c)&&isFinite(srt[i-1].c)&&srt[i].c>srt[i-1].c+1e-9){srt[i].mq.style.borderColor='#ef4444';srt[i].uc.style.borderColor='#ef4444';ok=false;if(!msg)msg='A larger quantity must have a lower unit price than a smaller one.';} }
        if(err)err.textContent=ok?'':('⚠ '+msg); var sb=host.querySelector('.pl-submit'); if(sb){ sb.disabled=!ok; sb.style.opacity=ok?'1':'.5'; sb.style.cursor=ok?'pointer':'not-allowed'; } return ok; }
      function draw(){ host.innerHTML='<div style="font-size:12px;color:#475569;margin-bottom:7px">Applies from: <select class="pl-efp" style="padding:4px 7px;border:1px solid #cbd5e1;border-radius:5px">'+prodOpts+'</select></div>'

// ── Silent auto-update (supplier portal) ── mirrors the main app: reload on a new deploy or a >30-min stale
// session, silently when backgrounded/idle, else a small Refresh nudge.
(function(){
  var BOOT='__APP_VERSION__'; if(!/^v?\d/.test(BOOT))return;
  var pending=false,nagShown=false,nagMsg='A new version is ready.',lastAct=Date.now(),STALE_MS=30*60*1000,IDLE_MS=90*1000;
  ['mousemove','keydown','mousedown','scroll','touchstart'].forEach(function(ev){window.addEventListener(ev,function(){lastAct=Date.now();},{passive:true,capture:true});});
  function nag(){ if(nagShown||!document.body)return; nagShown=true; var d=document.createElement('div');
    d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2147483000;background:#fde047;color:#111827;font:700 15px system-ui;padding:11px 18px;display:flex;gap:16px;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(0,0,0,.28);border-bottom:2px solid #eab308';
    d.innerHTML='<span style="font-size:16px">🔄 '+nagMsg+'</span><button id="hz-pu-go" style="background:#111827;color:#fde047;border:0;border-radius:6px;padding:8px 18px;font-weight:700;font-size:14px;cursor:pointer">Refresh now</button>';
    document.body.appendChild(d); document.getElementById('hz-pu-go').onclick=function(){location.reload();}; }
  function apply(){ if(!pending)return; if(document.hidden){location.reload();return;} if(Date.now()-lastAct>IDLE_MS){location.reload();return;} nag(); }
  function check(){ fetch('/api/version',{cache:'no-store',credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(j){ if(j&&j.version&&j.version!==BOOT){pending=true;apply();} }).catch(function(){}); }
  document.addEventListener('visibilitychange',function(){ if(document.hidden){apply();}else{lastAct=Date.now();check();} });
  window.addEventListener('focus',function(){lastAct=Date.now();check();});
  setInterval(check,5*60*1000); setInterval(function(){if(pending)apply();},30*1000); setTimeout(check,15000);
  setTimeout(function(){ if(!pending){pending=true;nagMsg='This session has been open a while — refreshing to stay current.';} apply(); },STALE_MS);
})();
