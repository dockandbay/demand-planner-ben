  function actBuild(rows,c){
    actRows=rows; rows.forEach(function(r,i){ r._id=i; });

    var types=Array.from(new Set(rows.map(function(r){return r.type;})));
    var STAT=[['open','Open'],['snoozed','Snoozed'],['dismissed','Dismissed'],['done','Done'],['all','All']];
    var st={sev:'All',status:'open',types:[]};   // types: [] = all

    function actTypeOutside(e){ var pop=document.getElementById('act-typepop'),btn=document.getElementById('act-typebtn');

        +'<span class="pill-lbl" style="margin-left:14px">Type</span>'

  function actCard(r){

    var delim=lines[0].indexOf('\t')>=0?'\t':','; function sp(l){return l.split(delim).map(function(x){return x.trim();});}
    var first=sp(lines[0]).map(function(x){return x.toLowerCase();});
    var hasHeader=first.some(function(x){return x==='po'||x==='po number'||x==='po#'||x.indexOf('supplier')>=0||x.indexOf('ship')>=0||x==='branch'||x.indexOf('status')>=0;});
    var map={po:0,supplier_name:-1,country_code:-1,branch:-1,status:-1,start_production:-1}, start=0;
    if(hasHeader){ start=1; first.forEach(function(h,idx){
      if(h==='po'||h==='po number'||h==='po#')map.po=idx;
      else if(h.indexOf('supplier')>=0)map.supplier_name=idx;
      else if(h.indexOf('ship')>=0||h==='country'||h==='country_code')map.country_code=idx;
      else if(h.indexOf('branch')>=0)map.branch=idx;
      else if(h.indexOf('status')>=0)map.status=idx;
      else if(h.indexOf('start')>=0)map.start_production=idx; });
    } else { map={po:0,supplier_name:1,country_code:2,branch:3,status:4,start_production:-1}; }
    var out=[]; for(var i=start;i<lines.length;i++){ var c=sp(lines[i]); var po=(c[map.po]||'').trim(); if(!po)continue;
      out.push({po:po, supplier_name:map.supplier_name>=0?(c[map.supplier_name]||''):'',
        country_code:map.country_code>=0?(c[map.country_code]||'').toUpperCase():'',
        branch:map.branch>=0?(c[map.branch]||''):'', status:map.status>=0?(c[map.status]||''):'',
        start_production:map.start_production>=0?(c[map.start_production]||''):''}); }
    return out; }

  // FOB pickup = the goods don't land into one of our import warehouses (UK/US/EU/AU/CA) AND no shipment is
  // assigned yet. DIRECT / "Direct to Client" / blank destinations are pickup → no freight or import.
  // Once a shipment is assigned it takes priority (it carries the real destination + mode, incl. fob $0).
  function isFOBdest(r){ if(r.shipment)return false; return !/^(UK|US|EU|AU|CA)/i.test((r.country||'').trim()); }
  // shared exceptions/actions for a PO — drives both the PLAN tab badges and the grid PO-ref flag.
  // d (po-detail) is optional; the supplier-invoice discrepancy only resolves once it's loaded.
  function poExceptions(r,d){ if(!r)return {pay:[],dates:[],client:[],landed:[],timeline:[],oplan:[],all:[]};
    var n=function(v){return Number(v)||0;};
    var today=new Date().toISOString().slice(0,10);
    var paid=n(r.start_assigned)+n(r.completion_assigned)+n(r.balance_1_amount)+n(r.balance_2_amount);
    var totalDue=Math.round((n(r.value_used)+n(r.credit_amount)-paid)*100)/100;
    var startUnpaid=(r.start_assigned==null && !r.deposit_ref), compUnpaid=(r.completion_assigned==null);
    var open=(r.progress!=='complete');   // completed POs don't raise payment/freight actions (not actionable noise)
    var pay=[];
    // only overdue if there's actually an amount for that milestone (a 0% deposit is never "overdue")
    if(open && r.start_due && r.start_due<today && startUnpaid && n(r.start_calc)>0.009) pay.push('Start deposit overdue ('+fd(r.start_due)+')');
    if(open && r.completion_due && r.completion_due<today && compUnpaid && n(r.completion_calc)>0.009) pay.push('Completion payment overdue ('+fd(r.completion_due)+')');
    if(open && r.balance_due && r.balance_due<today && totalDue>0.01) pay.push('Balance overdue ('+fd(r.balance_due)+')');
    // supplier-submitted invoice awaiting approve/reject (actionable on any PO — shows on the grid flag and the PAYMENTS badge)
    if(r.sup_invoice_pending!=null) pay.push('Supplier invoice '+money(r.sup_invoice_pending)+' awaiting approve/reject');
    if(d&&d.sup_invoice&&d.sup_invoice.status==='applied'){ var sv=Number(d.sup_invoice.value), fv=(r.final_invoice!=null?Number(r.final_invoice):null);
      if(fv!=null&&Math.abs(sv-fv)>0.01) pay.push('Supplier invoice '+money(sv)+' differs from final '+money(fv)); }
    // FOB = no import-warehouse destination AND no shipment yet (pickup; once a shipment is assigned it takes priority).
    var isFOB=isFOBdest(r);
    var frEst; if(r.flex_quote!=null) frEst=Number(r.flex_quote); else { var se=seaEst(r.sea_tiers,r.pallets); frEst=se?se.cost:null; }
    var landed=[]; if(open && frEst==null && !isFOB && !r.shipment) landed.push('No freight rate for destination'+(r.country?' ('+r.country+')':'')+' — can’t estimate sea freight');
    var dates=[]; if(r.sup_completion_pending) dates.push('Supplier completion date '+fd(r.sup_completion_pending)+' awaiting approve/reject');
    var timeline=[]; if(Number(r.unread_notes)>0) timeline.push(r.unread_notes+' unread supplier note'+(r.unread_notes>1?'s':''));
    var oplan=[]; if(Number(r.orderplan_unconfirmed)>0) oplan.push(r.orderplan_unconfirmed+' unconfirmed order-plan change'+(r.orderplan_unconfirmed>1?'s':''));
    return { pay:pay, dates:dates, client:[], landed:landed, timeline:timeline, oplan:oplan, all:pay.concat(dates).concat(landed).concat(timeline).concat(oplan) }; }
  function payPanel(r,d){ if(!r)return '';

    var bal1=Number(r.balance_1_amount), owe=Number(r.balance_owing)||0;
    var partial = r.balance_1_amount!=null && bal1>0 && bal1 < owe-0.01;
    // status: a start deposit drawn on a deposit ref is covered (not a cash 'due'); ref picked but

  // ---- ORDER PLAN (side-by-side: SKU rows × PO columns; status/country pills, production default) ----
  function renderOrderPlan(lines){ var c=document.getElementById('supply-content');
    Promise.all([fetch('/api/supply/skus').then(function(r){return r.json();}).catch(function(){return [];}),
      fetch('/api/supply/portal-line-costs').then(function(r){return r.json();}).catch(function(){return [];})])
      .then(function(res){ opBuild(lines,c,res[0]||[],res[1]||[]); }).catch(function(){opBuild(lines,c,[],[]);}); }
  function opBuild(lines,c,skuMaster,plc){ plc=plc||[];
    var plcMap={}; plc.forEach(function(x){ plcMap[x.po+'|'+x.sku]=x; });   // (po|sku) → supplier change (for inline confirm in cells)
    function uniq(k){var s={};lines.forEach(function(l){if(l[k])s[l[k]]=1;});return Object.keys(s).sort();}
    var statuses=uniq('status'), countries=uniq('country'), prods=uniq('prod_no');
    // COMPLETE POs (1000+ from the ERP history) are excluded from the status pills + "All" — including them
    // in an all-SKUs pivot explodes it (crashes). They surface only via a PO search in the PO box (≥5 chars),
    // which overrides the status filter.
    var pillStatuses=statuses.filter(function(s){return !/complete/i.test(s);});
    var cats=Array.from(new Set(skuMaster.map(function(s){return s.category;}).concat(lines.map(function(l){return l.category;})).filter(Boolean))).sort();
    var rws=Array.from(new Set(skuMaster.map(function(s){return s.release_window;}).filter(Boolean))).sort();
    var skuCat={},skuRW={},skuAttr={}; skuMaster.forEach(function(s){skuCat[s.sku]=s.category;skuRW[s.sku]=s.release_window;
      skuAttr[s.sku]={sup:s.supplier||'',cq:s.carton_qty||'',dis:s.discontinue||'',disAu:s.discontinue_au||'',disCa:s.discontinue_ca||'',sm:s.supplier_multiple_all||''};});
    lines.forEach(function(l){if(l.category)skuCat[l.sku]=l.category; if(l.release_window)skuRW[l.sku]=l.release_window;});
    var defS=statuses.filter(function(s){return /production/i.test(s);}); if(!defS.length)defS=statuses.slice(0,1);
    var st={statuses:new Set(defS),countries:new Set(countries),prod:'All',cat:'All',q:'',poq:'',scope:'ordered',rw:'All',partials:false,erpdiff:false,suprisk:false,disc:false};
    // action sets (exclude complete POs): unapproved partial cartons, and lines whose planned qty differs from the ERP
    function isUnapprovedPartial(l){ return !/complete/i.test(l.status||'') && (l.full_carton_check||'').indexOf('⚠')>=0; }
    function erpDiff(l){ return !/complete/i.test(l.status||'') && Number(l.qty)!==Number(l.erp_qty==null?l.qty:l.erp_qty); }
    // supplier risk: line ordered against a PO whose supplier isn't in the SKU's allowed multi-supplier list.
    function supMismatch(l){ var a=skuAttr[l.sku]||{}; var allowed=(a.sm||'').split(',').map(function(s){return s.trim().toLowerCase();}).filter(Boolean); var ps=(l.supplier_name||'').trim().toLowerCase(); return allowed.length>0 && !!ps && allowed.indexOf(ps)<0; }
    // discontinued: line's arrive (delivery) date is after the SKU's discontinue date (per-destination).

  // Cheapest container combination for N pallets given the tiers [{cap,cost,sz}] (DP). Returns {cost, combo:{sz:n}}.
  function seaEst(tiers,pallets){ if(!tiers||!tiers.length)return null; var pal=Math.ceil(Number(pallets)||0); if(pal<=0)return {cost:0,combo:{}};
    var INF=1e12, dp=[0], ch=[-1];
    for(var n=1;n<=pal;n++){ var best=INF,bi=-1; tiers.forEach(function(t,ti){ if(t.cost==null||!t.cap)return; var rem=Math.max(0,n-t.cap), c=dp[rem]+Number(t.cost); if(c<best){best=c;bi=ti;} }); dp[n]=best; ch[n]=bi; }
    if(dp[pal]>=INF)return null;
    var combo={}, n=pal; while(n>0){ var ti=ch[n]; if(ti<0)break; var sz=tiers[ti].sz||'?'; combo[sz]=(combo[sz]||0)+1; n=Math.max(0,n-tiers[ti].cap); }

    if(m==='air')return {c:Math.round((Number(s.weight_kg)||0)*(Number(s.air_rate)||15)),src:'~air'};

  // PAYMENTS ENGINE — txns grouped into date-runs; run header carries bank/ccy/bank-amount/FX → USD-equiv vs legs.
  var payTab='pay'; // 'pay' (register) | 'other' (sundry)
  // Payments report date filter (typed YYYY / YYYY-MM / YYYY-MM-DD). Defaults to the last 60 days so the
  // report opens on recent activity (the register holds full history back to 2017); Clear to see everything.
  var PAY_FROM=(function(){ var d=new Date(); d.setDate(d.getDate()-60); return d.toISOString().slice(0,10); })(), PAY_TO='';
  var OTH_STATE={status:'unpaid',supplier:''};   // Other Payments filters (persist across re-renders); default to unpaid
  var PDUE_STATE={status:'outstanding',supplier:''};   // Payments Due filters (persist across re-renders)
  // ---- CASH FLOW: itemised payment lines, flat list, filterable by month ----
  var CF_TYPES=['Deposit','Completion','Balance','Freight','Import duty','Import tax'];
  var CF_BG={Deposit:'bg-blue',Completion:'bg-amber',Balance:'bg-green',Freight:'bg-neutral','Import duty':'bg-red','Import tax':'bg-red'};
  var _cfState={types:null,status:'all',basis:'all',country:'',month:null,q:''};   // month:null = not yet set (defaults to current month)
  function cfMonthLabel(m){ if(m==='—')return 'Undated'; var p=m.split('-'); return MON[+p[1]-1]+' '+p[0]; }
  // all filters EXCEPT month (month is applied to the list only, so the summary strip stays a forward overview)
  function cfFilter(lines){ var s=_cfState;
    return lines.filter(function(x){
      if(s.types && !s.types[x.type])return false;
      if(s.status==='unpaid'&&x.paid)return false;
      if(s.status==='paid'&&!x.paid)return false;
      if(s.status==='overdue'&&!x.overdue)return false;
      if(s.basis==='committed'&&x.estimate)return false;
      if(s.basis==='estimate'&&!x.estimate)return false;
      if(s.country&&(x.country||'').toUpperCase()!==s.country)return false;
      if(s.q){ var q=s.q.toLowerCase(); if(((x.ref||'')+' '+(x.supplier||'')+' '+x.type).toLowerCase().indexOf(q)<0)return false; }
      return true; }); }
  function renderCashflow(d){ var c=document.getElementById('rep-body')||document.getElementById('supply-content');
    var today=d.today, curMonth=today.slice(0,7), exportLines=[];   // exportLines = the currently-filtered list (Copy/CSV)
    if(!_cfState.types){ _cfState.types={}; CF_TYPES.forEach(function(t){_cfState.types[t]=true;}); }
    // month options from the data; default the list to the current month (else all)
    var monthsAll={}; d.lines.forEach(function(x){monthsAll[x.month]=1;});
    var monthList=Object.keys(monthsAll).sort(function(a,b){ if(a==='—')return 1; if(b==='—')return -1; return a<b?-1:1; });
    if(_cfState.month===null) _cfState.month=monthsAll[curMonth]?curMonth:'';

      // summary strip = next 6 months forward (reflects every filter except the month picker)
      var mg={},mo=[]; base.forEach(function(x){ if(x.month==='—')return; if(!mg[x.month]){mg[x.month]=[];mo.push(x.month);} mg[x.month].push(x); });
      mo.sort(); var fut=mo.filter(function(m){return m>=curMonth;}).slice(0,6);
      var strip=fut.map(function(m){ var g=mg[m]; var com=0,est=0; g.forEach(function(x){ if(x.estimate)est+=x.amount; else com+=x.amount; });
        var sel=(_cfState.month===m);

    var monthSelHtml='<select class="flt" id="cf-month" style="width:auto"><option value="">All months</option>'+monthList.map(function(m){return '<option value="'+esc(m)+'"'+(_cfState.month===m?' selected':'')+'>'+cfMonthLabel(m)+'</option>';}).join('')+'</select>';
    var countrySelHtml='<select class="flt" id="cf-country" style="width:auto"><option value="">All markets</option>'+['UK','US','EU','AU','CA'].map(function(cc){return '<option'+(_cfState.country===cc?' selected':'')+'>'+cc+'</option>';}).join('')+'</select>';
    c.innerHTML='<div class="bar" style="flex-wrap:wrap;gap:6px"><span class="tiny mut">Month:</span>'+monthSelHtml

      +'<span class="count">as of '+esc(fd(today))+'</span></span></div>'
      +'<div id="cf-body"><div class="count">Loading…</div></div>';
    function cfExportRows(){ return exportLines.map(function(x){ return {
      Date:x.date||'', Month:cfMonthLabel(x.month), Type:x.type, Reference:x.ref||'', Supplier:x.supplier||'',
      Market:x.country||'', Amount_USD:x.amount, Status:(x.paid?'Paid':x.overdue?'Overdue':'Due'),
      Kind:x.date_kind, Basis:x.basis, Class:(x.estimate?'estimate':'committed'),

    function cfTag(){ return _cfState.month?cfMonthLabel(_cfState.month):'all months'; }
    c.querySelector('#cf-copy').onclick=function(){ copyRows(cfExportRows(),'Cash flow ('+cfTag()+')'); };

    c.querySelectorAll('.pill[data-st]').forEach(function(p){p.onclick=function(){_cfState.status=p.dataset.st;c.querySelectorAll('.pill[data-st]').forEach(function(x){x.classList.toggle('active',x===p);});draw();};});
    c.querySelectorAll('.pill[data-bs]').forEach(function(p){p.onclick=function(){_cfState.basis=p.dataset.bs;c.querySelectorAll('.pill[data-bs]').forEach(function(x){x.classList.toggle('active',x===p);});draw();};});
    c.querySelector('#cf-country').onchange=function(){_cfState.country=this.value;draw();};
    c.querySelector('#cf-q').oninput=function(){_cfState.q=this.value;draw();};
    draw(); }

  // OTHER PAYMENTS + PAYMENTS REPORT now live as sub-tabs under PRODUCTIONS (renderProductions). Both render
  // into a passed container so they're reusable.
  function renderOtherPayments(b){ b.innerHTML='<div class="count">Loading…</div>';
    fetchLookups(function(){   // ensure supplierList is loaded so the Supplier field is a real search dropdown
    fetch('/api/supply/deposits').then(function(r){return r.json();}).then(function(rows){ var oth=(rows||[]).filter(function(r){return !r.is_deposit;});
      var today=new Date().toISOString().slice(0,10); var OEDIT={};   // paid rows unlocked for editing (per render)
      var sups=Array.from(new Set(oth.map(function(d){return d.supplier_name;}).filter(Boolean))).sort();
      function statusOf(d){ return d.date_paid?'paid':((d.date_due&&d.date_due<today)?'overdue':'unpaid'); }
      function otherRow(d){ var ep='/api/supply/deposit/'+encodeURIComponent(d.id);
        var paid=!!d.date_paid, editing=!!OEDIT[d.id], locked=paid&&!editing, stt=statusOf(d);
        function txt(v,isd){ return (v==null||v==='')?'<span class="mut">—</span>':esc(isd?fd(v):v); }
        var badge=stt==='paid'?'<span class="tool-badge bg-green">Paid</span>':stt==='overdue'?'<span class="tool-badge bg-red">Overdue</span>':'<span class="tool-badge bg-amber">Unpaid</span>';
        var cells = locked
          ? '<td class="l">'+txt(d.reference)+'</td><td class="l">'+txt(d.supplier_name)+'</td><td class="l">'+txt(d.description)+'</td><td>'+txt(d.amount)+'</td><td class="l">'+txt(d.date_due,true)+'</td><td class="l">'+txt(d.date_paid,true)+'</td>'
          : '<td class="l">'+editCell(ep,'reference',d.reference,'txt')+'</td><td class="l">'+supSel(ep,d.supplier_name)+'</td><td class="l">'+editCell(ep,'description',d.description,'txt')+'</td><td>'+editCell(ep,'amount',d.amount)+'</td><td class="l">'+editCell(ep,'date_due',d.date_due,'date')+'</td><td class="l">'+editCell(ep,'date_paid',d.date_paid,'date')+'</td>';
        var act = paid ? (editing?'<button class="lnk-btn oth-save" data-id="'+d.id+'">✓ save</button>':'<button class="lnk-btn oth-edit" data-id="'+d.id+'">edit</button>') : '';
        // paid items can't be deleted (a payment date locks deletion) — only unpaid rows get the delete link
        if(!paid) act += ' <button class="lnk-btn oth-del" data-id="'+d.id+'" data-ref="'+esc(d.reference||d.description||('#'+d.id))+'" title="delete this payment" style="color:#dc2626">delete</button>';
        return '<tr'+(locked?' style="opacity:.55"':(editing?' style="background:#f0f6ff"':''))+'>'+cells+'<td class="l">'+badge+'</td><td class="l" style="white-space:nowrap">'+act+'</td></tr>'; }
      // status filter is inclusive: "unpaid" = anything not paid (incl. overdue); "overdue" = not paid & past due
      function matchStatus(d){ var s=OTH_STATE.status; if(s==='all')return true; var paid=!!d.date_paid;
        if(s==='paid')return paid; if(s==='unpaid')return !paid; if(s==='overdue')return !paid && d.date_due && d.date_due<today; return true; }
      function filtered(){ return oth.filter(function(d){
        if(!matchStatus(d))return false;
        if(OTH_STATE.supplier && (d.supplier_name||'')!==OTH_STATE.supplier)return false; return true; }); }
      function draw(){ var f=filtered();
        var stPills=[['all','All'],['paid','Paid'],['overdue','Overdue'],['unpaid','Unpaid']].map(function(o){return '<span class="pill'+(OTH_STATE.status===o[0]?' active':'')+'" data-os="'+o[0]+'">'+o[1]+'</span>';}).join('');
        var supOpts='<option value="">All suppliers</option>'+sups.map(function(s){return '<option value="'+esc(s)+'"'+(OTH_STATE.supplier===s?' selected':'')+'>'+esc(s)+'</option>';}).join('');
        document.getElementById('oth-wrap').innerHTML='<div class="bar" style="gap:5px"><span class="pill-lbl">Status</span>'+stPills
          +' <span class="pill-lbl" style="margin-left:8px">Supplier</span><select class="flt" id="oth-sup" style="width:auto">'+supOpts+'</select>'
          +'<span class="count" style="margin-left:auto">'+f.length+' / '+oth.length+'</span></div>'
          +'<div class="tw"><table><thead><tr><th class="l">Reference</th><th class="l">Supplier</th><th class="l">Description</th><th>Amount</th><th class="l">Due date</th><th class="l">Date paid</th><th class="l">Status</th><th class="l"></th></tr></thead><tbody>'+(f.map(otherRow).join('')||'<tr><td colspan="8" class="l mut">No other payments match.</td></tr>')+'</tbody></table></div>';
        bindEdits();
        document.querySelectorAll('#oth-wrap .pill[data-os]').forEach(function(p){p.onclick=function(){OTH_STATE.status=p.dataset.os;draw();};});
        document.getElementById('oth-sup').onchange=function(){OTH_STATE.supplier=this.value;draw();};
        document.querySelectorAll('#oth-wrap .oth-edit').forEach(function(btn){btn.onclick=function(){OEDIT[btn.dataset.id]=true;draw();};});
        document.querySelectorAll('#oth-wrap .oth-save').forEach(function(btn){btn.onclick=function(){renderOtherPayments(b);};});   // relock + refresh (edits auto-saved inline)
        document.querySelectorAll('#oth-wrap .oth-del').forEach(function(btn){btn.onclick=function(){ if(!confirm('Delete other payment "'+btn.dataset.ref+'"? This cannot be undone.'))return;
          shipPost('/api/supply/deposit/'+btn.dataset.id+'/delete',{},function(){ renderOtherPayments(b); }); };});
      }
      b.innerHTML=lookupDatalists()+'<div class="bar"><button class="tool-badge bg-neutral" id="oth-new" style="cursor:pointer;border:none">+ Other payment</button><span class="count">sundry costs (freight, fees, write-offs) — paid rows lock; Edit to change</span></div><div id="oth-wrap"></div>';
      document.getElementById('oth-new').onclick=function(){ shipPost('/api/supply/deposit-create',{is_deposit:false},function(){ renderOtherPayments(b); }); };
      draw(); })
      .catch(function(e){b.innerHTML='<div style="color:#dc2626">'+esc(e.message||e)+'</div>';}); }); }
  // ---- PAYMENTS DUE — one worklist of every payment owed, grouped by supplier, ordered by due date.
  // Sources: PO completion + balance milestones (from the PO calc) and the deposit register + other payments.
  // EXCLUDES the per-PO starting deposit (that is funded via the deposit register, shown here as "Deposit").
  // Each row shows the amount + due date and has inline assigned-amount + payment-date fields, so payments
  // can be seen AND recorded in one place. Overdue (due date past, not yet paid) is highlighted red.
  var PDUE_BG={Completion:'bg-amber',Balance:'bg-green',Deposit:'bg-blue',Other:'bg-neutral'};
  function renderPaymentsDue(b){ b.innerHTML='<div class="count">Loading…</div>';
    Promise.all([fetch('/api/supply/purchase-orders').then(function(r){return r.json();}),
                 fetch('/api/supply/deposits').then(function(r){return r.json();})])
      .then(function(res){ buildPaymentsDue(b, res[0]||[], res[1]||[]); })
      .catch(function(e){b.innerHTML='<div style="color:#dc2626">'+esc(e.message||e)+'</div>';}); }
  function buildPaymentsDue(b, pos, deps){
    var today=new Date().toISOString().slice(0,10);
    var rows=[];
    (pos||[]).forEach(function(p){ if(p.progress==='complete')return; var ep='/api/supply/po/'+encodeURIComponent(p.po);
      if(Number(p.completion_calc)>0.009) rows.push({sup:p.supplier_name||'',type:'Completion',ref:p.po,due_amt:Number(p.completion_calc),due:p.completion_due||'',ep:ep,amt_field:'pay_completion_assigned',amt_val:p.completion_assigned,dt_field:'pay_completion_date',dt_val:p.completion_date,po:true});
      if(Number(p.balance_owing)>0.009) rows.push({sup:p.supplier_name||'',type:'Balance',ref:p.po,due_amt:Number(p.balance_owing),due:p.balance_due||'',ep:ep,amt_field:'pay_balance_1_amount',amt_val:p.balance_1_amount,dt_field:'pay_balance_1_date',dt_val:p.balance_1_date,po:true}); });
    (deps||[]).forEach(function(d){ if(d.status==='closed')return;
      if(!(Number(d.amount)>0.009) && !d.date_paid && !d.date_due) return;   // skip empty stubs
      rows.push({sup:d.supplier_name||'',type:d.is_deposit?'Deposit':'Other',ref:d.reference||d.description||('#'+d.id),due_amt:Number(d.amount)||0,due:d.date_due||'',ep:'/api/supply/deposit/'+encodeURIComponent(d.id),amt_field:'amount',amt_val:d.amount,dt_field:'date_paid',dt_val:d.date_paid,po:false}); });
    rows.forEach(function(r){ r.paid=!!r.dt_val; r.overdue=!r.paid && !!r.due && r.due<today; });
    var sups=Array.from(new Set(rows.map(function(r){return r.sup;}))).filter(Boolean).sort();
    function pass(r){ if(PDUE_STATE.status==='outstanding'&&r.paid)return false;
      if(PDUE_STATE.status==='overdue'&&!r.overdue)return false;
      if(PDUE_STATE.status==='paid'&&!r.paid)return false;
      if(PDUE_STATE.supplier&&r.sup!==PDUE_STATE.supplier)return false; return true; }
    b.innerHTML=lookupDatalists()+'<div class="bar" id="pdue-bar"></div><div id="pdue-wrap"></div>';
    function draw(){ var f=rows.filter(pass);
      // group by supplier; order groups by earliest due date, rows within a group by due date
      var groups={}; f.forEach(function(r){ (groups[r.sup||'—']=groups[r.sup||'—']||[]).push(r); });
      var order=Object.keys(groups).sort(function(a,c){ var ea=groups[a].map(function(r){return r.due||'9999';}).sort()[0], ec=groups[c].map(function(r){return r.due||'9999';}).sort()[0]; return ea.localeCompare(ec)||a.localeCompare(c); });
      var grand=0;
      var stP=[['outstanding','Outstanding'],['overdue','Overdue'],['paid','Paid'],['all','All']].map(function(o){return '<span class="pill'+(PDUE_STATE.status===o[0]?' active':'')+'" data-ps="'+o[0]+'">'+o[1]+'</span>';}).join('');
      var supOpts='<option value="">All suppliers</option>'+sups.map(function(s){return '<option value="'+esc(s)+'"'+(PDUE_STATE.supplier===s?' selected':'')+'>'+esc(s)+'</option>';}).join('');
      document.getElementById('pdue-bar').innerHTML='<span class="pill-lbl">Status</span>'+stP
        +' <span class="pill-lbl" style="margin-left:8px">Supplier</span><select class="flt" id="pdue-sup" style="width:auto">'+supOpts+'</select>'
        +'<span class="count" style="margin-left:auto">'+f.length+' payments · '+order.length+' suppliers</span>';
      var h='<div class="tw"><table><thead><tr><th class="l">Type</th><th class="l">Reference</th><th>Amount due</th><th class="l">Due date</th><th>Assigned £</th><th class="l">Payment date</th></tr></thead><tbody>';
      if(!f.length) h+='<tr><td colspan="6" class="l mut">No payments match this filter.</td></tr>';
      order.forEach(function(s){ var gr=groups[s].slice().sort(function(a,c){return (a.due||'9999').localeCompare(c.due||'9999')||a.type.localeCompare(c.type);});
        var sub=gr.reduce(function(t,r){return t+(r.due_amt||0);},0); grand+=sub;
        h+='<tr class="batchrow"><td class="l" colspan="3"><b>'+esc(s)+'</b> <span class="tiny mut">'+gr.length+' payment(s)</span></td><td class="l" colspan="3"><span class="tiny mut">subtotal due $'+money(sub)+'</span></td></tr>';
        gr.forEach(function(r){
          var dueCell=r.due?(r.overdue?'<span style="color:#dc2626;font-weight:700">'+esc(fd(r.due))+'</span>':esc(fd(r.due))):'<span class="mut">—</span>';
          // reference → its source: PO opens the PO with the PLAN expanded on the PAYMENTS tab; deposit/other open their register
          var refCell = r.po
            ? '<button class="lnk-btn pdue-ref" data-go="po" data-k="'+esc(r.ref)+'" title="open this PO — payment plan (PAYMENTS tab)">'+esc(r.ref)+'</button>'
            : r.type==='Deposit'
            ? '<button class="lnk-btn pdue-ref" data-go="dep" data-k="'+esc(r.ref)+'" title="open this deposit (Productions ▸ Deposits)">'+esc(r.ref)+'</button>'
            : '<button class="lnk-btn pdue-ref" data-go="other" title="open Other Payments">'+esc(r.ref)+'</button>';
          h+='<tr'+(r.overdue?' style="background:#fef2f2"':(r.paid?' style="opacity:.6"':''))+'>'
            +'<td class="l"><span class="tool-badge '+(PDUE_BG[r.type]||'bg-neutral')+'">'+esc(r.type)+'</span></td>'
            +'<td class="l">'+refCell+'</td>'
            +'<td>'+money(r.due_amt)+'</td>'
            +'<td class="l">'+dueCell+'</td>'
            +'<td>'+editCell(r.ep,r.amt_field,r.amt_val)+'</td>'
            +'<td class="l">'+editCell(r.ep,r.dt_field,r.dt_val,'date')+'</td></tr>'; }); });
      h+='<tr class="batchrow"><td class="l" colspan="2"><b>TOTAL DUE</b></td><td><b>'+money(grand)+'</b></td><td colspan="3"></td></tr>';
      document.getElementById('pdue-wrap').innerHTML=h+'</tbody></table></div>';
      bindEdits();
      document.querySelectorAll('#pdue-wrap .pdue-ref').forEach(function(x){ x.onclick=function(){ var g=x.dataset.go;
        if(g==='po')gotoPO(x.dataset.k,'pay'); else if(g==='dep')gotoDeposit(x.dataset.k); else gotoOther(); }; });
      document.querySelectorAll('#pdue-bar .pill[data-ps]').forEach(function(p){p.onclick=function(){PDUE_STATE.status=p.dataset.ps;draw();};});
      document.getElementById('pdue-sup').onchange=function(){PDUE_STATE.supplier=this.value;draw();}; }
    draw(); }
  function renderPaymentsReport(b){ b.innerHTML='<div class="count">Loading…</div>';

  var XB_HEAD='*ContactName,EmailAddress,POAddressLine1,POAddressLine2,POAddressLine3,POAddressLine4,POCity,PORegion,POPostalCode,POCountry,*InvoiceNumber,*InvoiceDate,*DueDate,Total,InventoryItemCode,Description,*Quantity,*UnitAmount,*AccountCode,*TaxType,TaxAmount,TrackingName1,TrackingOption1,TrackingName2,TrackingOption2,Currency,*OriginalAmount';
  // One Xero bill per payment run. The download EXCLUDES "other" payments but INCLUDES them in the total used

  // to every exported line (PO completion/balance + deposit); "other" lines are then dropped from the file.
  // USD runs (no non-USD bank ccy) export at face value. liveCcy/liveAmt come from the row inputs at click
  // time, so a freshly-typed currency works without a page refresh. *OriginalAmount always keeps USD.
  function xeroBillMatrix(run, liveCcy, liveAmt){
    var out=(run.lines||[]).filter(function(l){return l.source!=='other';});   // drop "other" from the file only
    if(!out.length) return null;
    var ccy=(liveCcy && liveCcy!=='USD') ? liveCcy : 'USD';
    var altAmt=Number(String(liveAmt==null?'':liveAmt).replace(/,/g,''));
    var alt = ccy!=='USD' && altAmt>0;
    var fullTotal = Number(run.total) || (run.lines||[]).reduce(function(s,l){return s+Number(l.amount);},0);  // incl. other
    var rate = (alt && fullTotal>0) ? altAmt/fullTotal : 1;
    var inv = 'SUPPLIER-PAYMENT-'+(run.supplier_code?run.supplier_code+'-':'')+run.dt;
    var dmy = xbDmy(run.dt);

    // exported total ties EXACTLY to the converted target (no 100,000.01 drift).
    var prelim=out.map(function(l){ var usd=Number(l.amount); var exact=alt?(usd*rate):usd; return { l:l, usd:usd, unit:Math.round(exact*100)/100, exact:exact }; });
    if(alt){ var target=Math.round(prelim.reduce(function(s,p){return s+p.exact;},0)*100)/100;
      var sumR=Math.round(prelim.reduce(function(s,p){return s+p.unit;},0)*100)/100;

  function xbToCsv(m){ return [m.header].concat(m.rows).map(function(r){return r.map(xbCell).join(',');}).join('\n')+'\n'; }

  function xbSummaryTsv(run, ccy, amt){

  function b2bRender(last,st){ var data=last.data, co=last.co, orderDate=last.date;
    var rate=st.cur==='USD'?10:7, sym=st.cur==='USD'?'$':'£';
    var csym=(co==='US'?'$':co==='EU'?'€':co==='AU'?'A$':co==='CA'?'C$':'£'), keepW=(st.keep==null?6:st.keep);
    var tReq=0,tStock=0,tInb=0,tFul=0,tShort=0,tAir=0,tRev=0,tMar=0,nShort=0,nTight=0,nOOS=0,nOK=0,nInb=0;
    var rowsH=data.map(function(x){ var d=x.d, qty=x.qty;
      var avail=d.available||0, vel=(d.recent_units||0)/90, wt=(d.weight==null||d.weight==='')?null:Number(d.weight);
      var ws=b2bWholesale(co,d.retail);
      // cost = market COGS (3PL, final) if set; else fall back to the average PO cost price
      var cogsV=(d.cogs==null||d.cogs===''||Number(d.cogs)<=0)?null:Number(d.cogs);
      var cost=cogsV!=null?cogsV:((d.avg_cost==null||d.avg_cost==='')?null:Number(d.avg_cost));
      // SMARTER, DATE-AWARE allocation. Stock available to ship ON the required-by date =
      //   on-hand − own-channel sales between now and then + inbound landing by then.
      // Reserve keepW weeks of own-channel cover, then give from the rest; the remainder is a true shortfall.
      var daysUntil=orderDate?Math.max(0,Math.floor((new Date(orderDate+'T00:00:00')-new Date(new Date().toISOString().slice(0,10)+'T00:00:00'))/86400000)):0;
      var expSold=Math.round(vel*daysUntil);                 // own-channel units sold before the date
      var inbBy=d.inbound_by_date||0;
      var projAtDate=Math.max(0, avail - expSold + inbBy);   // stock you can actually ship on the date
      var reserve=Math.ceil(vel*7*keepW), giveable=Math.max(0, projAtDate-reserve);
      var ful=Math.min(qty,giveable), short=Math.max(0,qty-ful);
      var coverAfter=vel>0?((projAtDate-ful)/vel/7):999;
      var air=(short>0&&wt!=null)?(short*wt*rate):null;
      var rev=ws!=null?ws*qty:null, mar=(ws!=null&&cost!=null)?((ws-cost)*qty):null;
      tReq+=qty;tFul+=ful;tShort+=short; if(air)tAir+=air; if(rev)tRev+=rev; if(mar)tMar+=mar;
      var nextTxt=d.next_inbound_date?units(d.next_inbound_qty)+' '+fd(d.next_inbound_date):'';
      var rec,cls;
      if(short>0){ rec='Short '+units(short)+(air!=null?' · rush air '+sym+fmInt(air):' · need weight')+(nextTxt?' · next in '+nextTxt:''); cls='bg-red'; nShort++; }
      else if(coverAfter<2){ rec='Hold — would stock out'; cls='bg-red'; nOOS++; }
      else if(coverAfter<keepW){ rec='Caution — '+coverAfter.toFixed(0)+'wk cover left'; cls='bg-amber'; nTight++; }
      else { rec='Give ✓ — '+(coverAfter>=999?'no sales':coverAfter.toFixed(0)+'wk left'); cls='bg-green'; nOK++; }
      var availSub='now '+units(avail)+(expSold>0?' − '+units(expSold)+' sold':'')+(inbBy>0?' + '+units(inbBy)+' in':'');
      return '<tr><td class="l" style="white-space:nowrap"><b>'+esc(d.sku)+'</b></td>'
        +'<td>'+units(qty)+'</td>'
        +'<td><b>'+units(projAtDate)+'</b><br><span class="tiny mut">'+availSub+'</span>'+(d.next_inbound_date?'<br><span class="tiny mut">next '+nextTxt+'</span>':'')+'</td>'
        +'<td><span class="mut">'+units(reserve)+'</span><br><span class="tiny mut">'+keepW+'wk cover</span></td>'
        +'<td><b>'+units(ful)+'</b></td>'
        +'<td>'+(short?'<b style="color:#991b1b">'+units(short)+'</b>':'0')+'</td>'
        +'<td>'+(vel>0?coverAfter.toFixed(0)+'w':'<span class="mut tiny">no sales</span>')+'</td>'
        +'<td>'+(wt==null?'<span class="mut tiny">—</span>':wt.toFixed(2))+'</td>'
        +'<td>'+(air!=null?sym+fmInt(air):'—')+'</td>'
        +'<td>'+(ws!=null?csym+fmInt(ws):'<span class="mut tiny">no price</span>')+'</td>'
        +'<td>'+(rev!=null?csym+fmInt(rev):'—')+'</td>'
        +'<td>'+(mar!=null?csym+fmInt(mar):'<span class="mut tiny">no cost</span>')+'</td>'
        +'<td class="l"><span class="tool-badge '+cls+'">'+esc(rec)+'</span></td></tr>';
    }).join('');
    // ---- order-level verdict: take it? stock impact? worth it after air cost? ----
    var net=tMar-tAir;
    var vClass,vTitle,vBody;
    var stockNote=(nOOS?nOOS+' would stock out, ':'')+(nShort?nShort+' short, ':'')+(nTight?nTight+' thin, ':'')+nOK+' covered';
    if(nOOS>0){ vClass='bg-red'; vTitle='✗ Decline / renegotiate — stock-out risk';
      vBody='Even after reserving '+keepW+'wk cover, '+nOOS+' SKU(s) can\'t be given without stocking out your own channels. Rush a replenishment first, or trim those lines.'; }
    else if(nShort>0){
      if(tAir>0 && net>0){ vClass='bg-amber'; vTitle='⚠ Take with air-freight — worth it';
        vBody='After giving from stock (keeping '+keepW+'wk cover) and any inbound by the date, '+units(tShort)+' units are short — rush by air for ~'+sym+fmInt(tAir)+'. Net after air ≈ '+csym+fmInt(net)+' (gross '+csym+fmInt(tMar)+'). '+stockNote+'.'; }
      else if(tAir>0){ vClass='bg-red'; vTitle='✗ Decline / renegotiate — air cost too high';
        vBody='Rushing the '+units(tShort)+'-unit shortfall by air costs ~'+sym+fmInt(tAir)+', which wipes out the '+csym+fmInt(tMar)+' margin (net ≈ '+csym+fmInt(net)+'). Push the date out (more inbound lands), part-ship, or raise the price.'; }
      else { vClass='bg-amber'; vTitle='⚠ Shortfall — add weights to cost the air-freight';

    else { vClass='bg-green'; vTitle='✓ Take it — fully covered from stock';

    var verdict='<div class="tool-badge '+vClass+'" style="display:block;padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.45">'
      +'<b>'+esc(vTitle)+'</b><div style="font-weight:400;margin-top:3px">'+esc(vBody)+'</div></div>';
    var kpi='<div class="kpibar">'

      +'<div class="kpi"><div class="l">Shortfall</div><div class="v"'+(tShort>0?' style="color:#991b1b"':'')+'>'+units(tShort)+'</div></div>'
      +'<div class="kpi"><div class="l">Air cost</div><div class="v">'+sym+fmInt(tAir)+'</div></div>'

      +'<div class="mut tiny" style="margin-top:4px"><b>Avail @ date</b> = on-hand today − own-channel sales between now and the required-by date + inbound landing by then (so a later date both sells down stock and lands more inbound). <b>Keep</b> = '+keepW+'wk of own-channel cover (velocity × '+keepW+'wk) held back before giving to B2B. <b>Fulfil</b> = min(requested, avail @date − keep); <b>Short</b> = the rest, rushed by air. Wholesale = 50% of ex-VAT retail (UK/EU ÷1.2). Air = short × unit weight × '+sym+rate+'/kg. Margin = (wholesale − market COGS, 3PL final; else avg PO cost) × qty; net after air in '+sym+'.</div>'; }

      fetch('/api/supply/buyplan-pos',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(p)}).then(function(r){return r.json();}).then(renderPreview).catch(function(e){document.getElementById('bp-result').innerHTML='<div style="color:#dc2626">'+esc(String(e))+'</div>';}); };
    document.getElementById('bp-create').onclick=function(){ var btn=this; var p=payload(true); if(!p.prod_no)return; btn.disabled=true; btn.textContent='Creating…';
      fetch('/api/supply/buyplan-pos',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(p)}).then(function(r){return r.json();}).then(function(d){ if(d.error)throw new Error(d.error);
        close(); if(window.gotoSupplySection)window.gotoSupplySection('order-plan'); setTimeout(function(){alert('Created '+(d.created||0)+' PO(s) for '+p.prod_no+'. Review & adjust in Order Plan, then Upload to push to the ERP.');},250); })
        .catch(function(e){ btn.disabled=false; btn.textContent='Create POs'; alert('Create failed: '+(e.message||e)); }); };
  }
  window.openBuyplanModal=function(country,items,mode){ try{ buyplanModal(country,items,mode); }catch(e){ if(window.console)console.log('[SUPPLY] buyplanModal',e&&e.message); } };
  window.gotoSupplySection=function(k){ try{ showSupply(true); selectSection(k); }catch(e){ if(window.console)console.log('[SUPPLY] goto',e&&e.message); } };
  // Context help for the current SUPPLY section (reuses the ANNOT descriptions). Returns {t,h}.
  window.supplyHelpText=function(){ var sec=current||'actions'; if(sec==='reports')sec=reportTab||'upcoming'; var raw=ANNOT[sec]||'';
    var t='SUPPLY', h=raw, m=raw.match(/^<b>([^<]*)<\/b>\s*([\s\S]*)$/);
    if(m){ t=m[1].replace(/[.\s]+$/,''); h=m[2]; }
    return {t:t, h:h||'This SUPPLY section.'}; };
  function boot(){ try{ ensureRoot(); ensureNavButton(); ensureScenarioRoot(); ensureScenarioButton();
    if(!_routed){ _routed=true; try{ if(/^#\/?(supply|scenario|demand|reports|buy|fba|planning|exec)(\/|$)/.test(location.hash)) applyRoute(); }catch(e){} }   // deep-link on first load
  }catch(e){ if(window.console)console.log('[SUPPLY] boot error',e&&e.message); } }
  if(window.console)console.log('[SUPPLY] inject __APP_VERSION__ executing');
  boot(); document.addEventListener('DOMContentLoaded',boot); window.addEventListener('load',boot);
  setTimeout(boot,600); setTimeout(boot,1800); setTimeout(boot,4000);
})();
</script>
