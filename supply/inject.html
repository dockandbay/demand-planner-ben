  var actRows=[];

  function prodStatusOpts(sel){ return PROD_STATUS.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===sel?' selected':'')+'>'+o[1]+'</option>';}).join(''); }
  function prodStatusLabel(v){ var m=PROD_STATUS.filter(function(o){return o[0]===v;}); return m.length?m[0][1]:''; }
  // Logic-based exception on the PO LIFECYCLE STATUS vs the production dates (returns '' when fine).
  // Status order: FUTURE → PRODUCTION → SHIPPING → DELIVERED → COMPLETE.
  function prodStatusStart(status, prodStart, today){ var s=String(status||'').toUpperCase(); today=today||new Date().toISOString().slice(0,10);
    // past the start date but the PO hasn't entered production yet (still FUTURE / unset). Once in PRODUCTION+
    // it has started, so being past the start date is expected — not an exception.
    if(prodStart && prodStart<today && (s===''||s==='FUTURE')) return 'Past production start ('+fd(prodStart)+') but status is still '+(s||'not set')+' (should be PRODUCTION, or extend date)'; return ''; }
  function prodStatusEnd(status, prodEnd, today){ var s=String(status||'').toUpperCase(); today=today||new Date().toISOString().slice(0,10);
    // past the completion date but still in production (or not yet started) — should have moved on to shipping.
    if(prodEnd && prodEnd<today && (s===''||s==='FUTURE'||s==='PRODUCTION')) return 'Past production completion ('+fd(prodEnd)+') but status is still '+(s||'not set')+' (should be SHIPPING or READY TO SHIP, or extend date)'; return ''; }
  function prodStatusException(status, prodStart, prodEnd, today){ return prodStatusStart(status,prodStart,today) || prodStatusEnd(status,prodEnd,today); }
  function cfLastMonth(cur){ var y=+cur.slice(0,4), m=+cur.slice(5,7)-1; return m===0?((y-1)+'-12'):(y+'-'+('0'+m).slice(-2)); }
  // Payment actions from the cash flow + other-payment register (timing = likely date if set, else due date):
  //   • one summary for UNPAID due LAST month  •  one INDIVIDUAL action per AGED unpaid item (before last month).
  function cfUnpaidActions(cf){ var out=[]; if(!cf||!cf.lines)return out;
    var cur=(cf.today||new Date().toISOString().slice(0,10)).slice(0,7), lm=cfLastMonth(cur);
    // (1) last month — single summary linking to the cash flow filtered to that month
    var lastSum=0,lastN=0;
    cf.lines.forEach(function(x){ if(x.paid||x.month==='—')return; if(x.month===lm){lastSum+=x.amount;lastN++;} });
    if(lastN) out.push({ severity:'amber', status:'open', type:'Unpaid — last month', ref:lastN+' payment'+(lastN>1?'s':'')+' · $'+units(lastSum),
      detail:lastN+' payment'+(lastN>1?'s':'')+' due last month ('+cfMonthLabel(lm)+') still unpaid — $'+units(lastSum)+'. Open the cash flow to review.',
      fix:'gotoreport', field:'cashflow', cfstatus:'overdue', cfmonth:lm, target:'', target_key:'cf-lastmonth' });
    // (2) aged — one action PER item (PO milestone / deposit / other payment), each linking to its source
    cf.lines.forEach(function(x){ if(x.paid||x.estimate||x.month==='—'||!(x.month<lm))return;   // committed only (skip freight/duty/tax estimates)
      var go=x.basis==='register'?'dep':x.basis==='other'?'other':'po';
      out.push({ severity:'high', status:'open', type:'Aged payment', ref:esc(x.ref)+' · '+x.type,
        detail:x.type+' · $'+units(x.amount)+' · '+(x.likely_date?('likely '+fd(x.likely_date)):('due '+(x.due?fd(x.due):'—')))+' · '+cfMonthLabel(x.month),
        fix:'gotoitem', gotarget:go, target:'', target_key:x.ref }); });
    return out; }

  // ---- PIPELINE: PO lifecycle as a grouped timeline (stages = groups; cards ordered by next milestone) ----
  var PIPE_HC={late:'#b91c1c',soon:'#d97706',ok:'#15803d',done:'#6b7280',unknown:'#9ca3af'};
  var _pipe={mkt:'all',hideOld:true};   // hide checked-in POs whose arrival is >4 weeks old by default
  function pipeNextLabel(p){ var v={awaiting:'starts',in_production:'completes',prod_complete:'ships',in_transit:'arrives',arriving:'arrives',checked_in:'arrived'}[p.stage];
    if(p.stage==='checked_in') return 'arrived '+fd(p.arrival);
    if(!p.next_date) return '<span class="mut">no date</span>';
    var d=p.next_days, when=d<0?('<b style="color:#b91c1c">'+(-d)+'d late</b>'):('in '+d+'d');
    return v+' '+fd(p.next_date)+' · '+when; }
  function renderPipeline(d){ var c=document.getElementById('rep-body')||document.getElementById('supply-content');
    var pos=d.pos||[], stages=d.stages||[];
    var mkts=Array.from(new Set(pos.map(function(p){return p.market||'?';}))).filter(Boolean).sort();
    var cutoff=new Date(Date.parse(d.today)-28*86400000).toISOString().slice(0,10);   // 4 weeks ago
    var view=function(){
      var nHidden=0;
      var f=pos.filter(function(p){
        if(_pipe.mkt!=='all'&&p.market!==_pipe.mkt)return false;
        if(_pipe.hideOld&&p.stage==='checked_in'&&p.arrival&&p.arrival<cutoff){ nHidden++; return false; }
        return true; });
      var nLate=f.filter(function(p){return p.health==='late';}).length, nSoon=f.filter(function(p){return p.health==='soon';}).length;
      var totVal=f.reduce(function(a,p){return a+(p.val||0);},0), totU=f.reduce(function(a,p){return a+(p.units||0);},0);
      var cols=stages.map(function(s){ var key=s[0], lbl=s[1];
        var ps=f.filter(function(p){return p.stage===key;}).sort(function(a,b){ var x=a.next_date||'9999',y=b.next_date||'9999'; return x<y?-1:x>y?1:0; });
        var u=ps.reduce(function(a,p){return a+(p.units||0);},0), v=ps.reduce(function(a,p){return a+(p.val||0);},0);
        var cards=ps.map(function(p){ var hc=PIPE_HC[p.health]||'#9ca3af';
          return '<div class="pipe-card" data-po="'+esc(p.po)+'" style="border-left:3px solid '+hc+';background:#fff;border:1px solid #e8e8e8;border-left:3px solid '+hc+';border-radius:5px;padding:6px 8px;margin-bottom:6px;cursor:pointer">'
            +'<div style="font-weight:700;font-size:11px">'+esc(p.po)+' <span class="mut tiny" style="font-weight:400">'+esc(p.market||'')+'</span></div>'
            +'<div class="mut tiny" style="margin:1px 0">'+esc(p.supplier||'—')+'</div>'
            +'<div style="font-size:10px;margin:2px 0">'+units(p.units)+' u · '+csymFor(p.market)+fmInt(p.val)+'</div>'
            +'<div style="font-size:10px;color:'+hc+'">'+pipeNextLabel(p)+'</div>'
            +(p.production_status?'<div class="mut tiny" style="margin-top:1px">✓ '+esc(prodStatusLabel(p.production_status))+(p.prod_conf_age!=null?' '+p.prod_conf_age+'d':'')+'</div>':'')
            +'</div>'; }).join('')||'<div class="mut tiny" style="padding:4px">—</div>';
        return '<div style="flex:0 0 200px;background:#f6f7f9;border-radius:7px;padding:8px;margin-right:8px">'
          +'<div style="font-weight:700;font-size:11px;letter-spacing:.02em">'+esc(lbl)+'</div>'
          +'<div class="mut tiny" style="margin:2px 0 8px">'+ps.length+' PO · '+units(u)+' u · £'+fmInt(v)+'</div>'+cards+'</div>'; }).join('');
      c.innerHTML=annot('pipeline')
        +'<div class="bar"><span class="pill'+(_pipe.mkt==='all'?' active':'')+'" data-m="all">All</span>'
          +mkts.map(function(m){return '<span class="pill'+(_pipe.mkt===m?' active':'')+'" data-m="'+esc(m)+'">'+esc(m)+'</span>';}).join('')
          +'<span class="pill'+(_pipe.hideOld?' active':'')+'" id="pipe-old" style="margin-left:10px" title="checked-in POs whose arrival is more than 4 weeks ago">'+(_pipe.hideOld?'✓ ':'')+'Hide checked-in &gt;4wk'+(nHidden?' ('+nHidden+')':'')+'</span>'
          +'<span class="count" style="margin-left:auto">'+f.length+' open PO · '+units(totU)+' units · £'+fmInt(totVal)+' · '
          +'<b style="color:#b91c1c">'+nLate+' late</b> · <b style="color:#d97706">'+nSoon+' due ≤7d</b></span></div>'
        +'<div style="display:flex;overflow-x:auto;padding-bottom:6px;align-items:flex-start">'+cols+'</div>'
        +'<div class="mut tiny" style="margin-top:6px">Each PO sits in one stage from its date chain + supplier-confirmed production status; cards are ordered by the next milestone and coloured <b style="color:#b91c1c">late</b> / <b style="color:#d97706">due ≤7d</b> / <b style="color:#15803d">on track</b>. Click a PO to open it in Purchase Orders. Checked-in POs older than 4 weeks are hidden by default.</div>';
      c.querySelectorAll('.bar .pill[data-m]').forEach(function(b){b.onclick=function(){_pipe.mkt=b.dataset.m;view();};});
      var po=document.getElementById('pipe-old'); if(po)po.onclick=function(){_pipe.hideOld=!_pipe.hideOld;view();};
      c.querySelectorAll('.pipe-card').forEach(function(b){b.onclick=function(){gotoPO(b.dataset.po);};});
    };
    view(); }
  function csymFor(m){ return m==='US'?'$':m==='EU'?'€':m==='AU'?'A$':m==='CA'?'C$':'£'; }

  var _up={mkt:'all',wk:'4'};
  function renderUpcoming(d){ var c=document.getElementById('rep-body')||document.getElementById('supply-content'); var pos=d.pos||[], today=d.today;
    var TYPES=[['completing','📦 Completing soon','#7c3aed'],['shipping','🚢 Shipping soon','#0369a1'],['arriving','📥 Arriving soon','#15803d']];
    var OVD={awaiting:'Start production',in_production:'Completing',prod_complete:'Shipping',in_transit:'Arriving',arriving:'Arriving'};  // overdue milestone by stage
    var WK=[['2','2 wk'],['4','4 wk'],['8','8 wk'],['all','All upcoming']];
    var mkts=Array.from(new Set(pos.map(function(p){return p.market;}))).filter(Boolean).sort();
    var view=function(){
      var cap=_up.wk==='all'?'9999-12-31':new Date(Date.parse(today)+Number(_up.wk)*7*86400000).toISOString().slice(0,10);
      function byDate(a,b){return a.date<b.date?-1:a.date>b.date?1:0;}
      function bd(date){ var dd=Math.round((Date.parse(date)-Date.parse(today))/86400000); return {dd:dd,c:dd<=7?'#d97706':'#333',m:dd<=7?'#d97706':'#888'}; }

          out.push({po:p.po,supplier:p.supplier,market:p.market,units:p.units,val:p.val,date:date,ship:p.shipment_ref||'',flex:p.flex||''}); });

      function poLink(po){ return '<a class="po-jump" data-po="'+esc(po)+'" style="color:#1d4ed8;font-weight:600;text-decoration:none;cursor:pointer" title="open this PO on its Dates tab">'+esc(po)+'</a>'; }
      function poRow(e,cls){ var b=bd(e.date); return '<tr class="'+(cls||'up-row')+'" data-po="'+esc(e.po)+'" style="cursor:pointer">'

        +'<td class="l">'+esc(e.market||'')+'</td><td>'+units(e.units)+'</td><td>'+csymFor(e.market)+fmInt(e.val)+'</td>'
        +'<td class="l">'+flexLink(e.flex)+'</td></tr>'; }
      function shipRow(g,id){ var b=bd(g.date), s=Object.keys(g.sup);
        return '<tr class="up-shiprow" data-ref="'+esc(g.ship)+'" style="cursor:pointer;background:#f8fafc">'
          +'<td class="l" style="white-space:nowrap;font-weight:600;color:'+b.c+'">'+fd(g.date)+'</td>'
          +'<td class="l" style="color:'+b.m+';white-space:nowrap">in '+b.dd+'d</td>'
          +'<td class="l"><button class="planbtn up-exp" data-id="'+id+'">▸</button> <b>🚢 '+esc(g.ship)+'</b> <span class="mut tiny">'+g.items.length+' PO</span></td>'
          +'<td class="l">'+esc(s.length>1?s.length+' suppliers':(s[0]||'—'))+'</td>'
          +'<td class="l">'+esc(g.market||'')+'</td><td>'+units(g.units)+'</td><td>'+csymFor(g.market)+fmInt(g.val)+'</td>'
          +'<td class="l">'+flexLink(g.flex)+'</td></tr>'
          +'<tr class="exp-row" id="upexp-'+id+'" style="display:none"><td colspan="8"><div style="padding:2px 2px 2px 24px">'
          +'<table style="font-size:11px;width:auto"><thead><tr><th class="l">PO</th><th class="l">Supplier</th><th>Units</th><th>Value</th><th class="l">Flexport</th></tr></thead><tbody>'
          +g.items.map(function(e){ return '<tr class="up-detpo" data-po="'+esc(e.po)+'" style="cursor:pointer"><td class="l">'+poLink(e.po)+'</td><td class="l">'+esc(e.supplier||'—')+'</td><td>'+units(e.units)+'</td><td>'+csymFor(e.market)+fmInt(e.val)+'</td><td class="l">'+flexLink(e.flex)+'</td></tr>'; }).join('')
          +'</tbody></table></div></td></tr>'; }
      // shipping & arriving group by master shipment (a shipment moves as one); completing stays per-PO
      function buildRows(type,list,secKey){ if(type==='completing'){ list.sort(byDate); return {n:list.length,html:list.map(function(e){return poRow(e);}).join('')}; }
        var groups={}, rows=[];
        list.forEach(function(e){ if(e.ship){ var g=groups[e.ship]; if(!g){g=groups[e.ship]={ship:e.ship,date:e.date,units:0,val:0,market:e.market,items:[],sup:{},flex:''};rows.push({date:e.date,g:g});} g.units+=e.units;g.val+=e.val;g.items.push(e);if(e.supplier)g.sup[e.supplier]=1;if(!g.flex&&e.flex)g.flex=e.flex;if(e.date<g.date)g.date=e.date; }
          else rows.push({date:e.date,e:e}); });
        rows.sort(byDate); var i=0;

          +'<td class="l">'+poLink(p.po)+(p.shipment_ref&&p.shipment_ref!==p.po?' <span class="mut tiny">🚢 '+esc(p.shipment_ref)+'</span>':'')+'</td>'
          +'<td class="l"><span class="tool-badge bg-red">'+esc(o.type)+'</span></td>'
          +'<td class="l">'+esc(p.supplier||'—')+'</td><td class="l">'+esc(p.market||'')+'</td>'
          +'<td>'+units(p.units)+'</td><td>'+csymFor(p.market)+fmInt(p.val)+'</td>'
          +'<td class="l">'+flexLink(p.flex)+'</td></tr>'; }).join('');
      var ovdSection='<div class="sect-h" style="color:#b91c1c;font-size:12px;margin-top:6px">⚠ Overdue ('+ovd.length+') — milestone date passed, not yet done</div>'

      var total=0;
      var sections=TYPES.map(function(t){ var r=buildRows(t[0],evs(t[0]),t[0]); total+=r.n;
        return '<div class="sect-h" style="color:'+t[2]+';font-size:12px;margin-top:14px">'+t[1]+' ('+r.n+')</div>'

      c.innerHTML=annot('upcoming')

          +'<span class="pill-lbl" style="margin-left:8px">Window</span>'+WK.map(function(w){return '<span class="pill'+(_up.wk===w[0]?' active':'')+'" data-w="'+w[0]+'">'+w[1]+'</span>';}).join('')

  function poUploadParse(text){ var lines=text.split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean); if(!lines.length)return [];
    var delim=lines[0].indexOf('\t')>=0?'\t':','; function sp(l){return l.split(delim).map(function(x){return x.trim();});}
    var first=sp(lines[0]).map(function(x){return x.toLowerCase();});
    var hasHeader=first.some(function(x){return x==='po'||x==='po number'||x==='po#'||x.indexOf('supplier')>=0||x.indexOf('ship')>=0||x==='branch'||x.indexOf('status')>=0||x==='sku'||x==='qty'||x.indexOf('quantity')>=0;});
    var map={po:0,supplier_name:-1,country_code:-1,branch:-1,status:-1,start_production:-1,sku:-1,qty:-1}, start=0;
    if(hasHeader){ start=1; first.forEach(function(h,idx){
      if(h==='po'||h==='po number'||h==='po#')map.po=idx;
      else if(h.indexOf('supplier')>=0)map.supplier_name=idx;
      else if(h.indexOf('ship')>=0||h==='country'||h==='country_code')map.country_code=idx;
      else if(h.indexOf('branch')>=0)map.branch=idx;
      else if(h.indexOf('status')>=0)map.status=idx;
      else if(h.indexOf('start')>=0)map.start_production=idx;
      else if(h==='sku'||h==='code'||h==='product')map.sku=idx;
      else if(h==='qty'||h.indexOf('quantity')>=0)map.qty=idx; });
    } else { map={po:0,supplier_name:1,country_code:2,branch:3,status:4,start_production:-1,sku:-1,qty:-1}; }
    var out=[]; for(var i=start;i<lines.length;i++){ var c=sp(lines[i]); var po=(c[map.po]||'').trim(); if(!po)continue;
      out.push({po:po, supplier_name:map.supplier_name>=0?(c[map.supplier_name]||''):'',
        country_code:map.country_code>=0?(c[map.country_code]||'').toUpperCase():'',
        branch:map.branch>=0?(c[map.branch]||''):'', status:map.status>=0?(c[map.status]||''):'',
        start_production:map.start_production>=0?(c[map.start_production]||''):'',
        sku:map.sku>=0?(c[map.sku]||''):'', qty:map.qty>=0?(c[map.qty]||''):''}); }
    return out; }

      return '<tr'+(lcr.unconfirmed?' style="background:#fff7ed"':'')+'><td class="l">'+esc(sku)+'</td>'
        +'<td style="text-align:right">'+qtyCell+'</td>'
        +'<td style="text-align:right">'+(est!=null?'$'+money(est):'<span class="mut">—</span>')+'</td>'
        +'<td style="text-align:right">'+(sup!=null?('<span'+(disc?' style="background:#fef3c7;color:#92400e;font-weight:700;padding:0 4px;border-radius:3px" title="differs from estimate"':'')+'>$'+money(sup)+(disc?' ⚠':'')+'</span>'):'<span class="mut">—</span>')+'</td>'
        +'<td style="text-align:right"><input class="fci opfin" data-po="'+esc(po)+'" data-sku="'+esc(sku)+'" data-qty="'+qn+'" data-fallback="'+fb+'" value="'+(fin!=null?esc(fin):'')+'" placeholder="'+(sup!=null?money(sup):(est!=null?money(est):'0'))+'" style="width:88px;text-align:right" inputmode="decimal"></td>'
        +'<td style="text-align:right" class="op-lt" data-sku="'+esc(sku)+'"><b>$'+money(lt)+'</b></td>'
        +'<td class="l" style="white-space:nowrap">'+confCell+'</td></tr>';
    }
    var rows=(lines||[]).map(function(l){ return row(l.sku, l.qty, (l.cost_price!=null&&l.cost_price!=='')?Number(l.cost_price):null, costs[l.sku], false); }).join('');
    Object.keys(costs).forEach(function(sku){ var c=costs[sku]; if(c&&c.is_added&&!lineSkus[sku]) rows+=row(sku, null, null, c, true); });
    if(!rows) rows='<tr><td colspan="7" class="mut">no lines</td></tr>';
    var banner = unconf>0 ? '<div style="margin:4px 0 8px;padding:7px 11px;background:#fff7ed;border:1px solid #fdba74;border-radius:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
        +'<span style="font-weight:700;color:#92400e">⚠ '+unconf+' unconfirmed supplier change'+(unconf>1?'s':'')+'</span>'
        +'<button class="save-btn op-accept-all" data-po="'+esc(po)+'">Accept all changes</button></div>' : '';
    // ERP deviations for THIS PO — QUANTITY only (price is never an exception; cost still rides along on push).
    // COMPLETE POs raise nothing. Outline = light yellow exception box. Table sizes to content (not full width);
    // SKU column ~45ch, nowrap, so long SKUs show in full. Plain scroll wrapper (NOT .tw — that forces
    // min-width:100% inside the expanded row and re-fattens the table).
    var erpDevBlock=(function(){
      var dev=erpDevLines(lines,erpMeta);
      if(!dev.length)return '';
      var red='color:#b91c1c;font-weight:600';
      var skuTd='class="l" style="min-width:45ch;white-space:nowrap;padding:2px 12px"';
      var trs=dev.map(function(l){
        var pq=Number(l.qty)||0, eq=(l.erp_qty==null?null:Number(l.erp_qty));
        var qCell='<span style="'+red+'">'+units(pq)+' → '+(eq==null?'not in ERP':units(eq))+'</span>';
        return '<tr><td '+skuTd+'>'+esc(l.sku)+'</td><td class="l" style="text-align:right;padding:2px 12px">'+qCell+'</td></tr>'; }).join('');
      return '<div style="margin:4px 0 10px;padding:9px 12px;background:#fefce8;border:1px solid #eab308;border-radius:6px;max-width:1000px">'
        +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:5px;flex-wrap:wrap"><span style="font-weight:700;color:#854d0e">⚠ ERP deviations — '+dev.length+' line'+(dev.length>1?'s':'')+' differ from Fulfil/Cin7 <span class="mut tiny" style="font-weight:400">(quantity)</span></span><button class="save-btn op-erp-up-panel" data-po="'+esc(po)+'" style="background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5">⬆ Upload to ERP</button> <span class="mut tiny">prices are pushed with the update too</span></div>'
        +'<div style="overflow-x:auto"><table class="erp-dev-tbl" style="width:auto;border-collapse:collapse;font-size:11px;border:1px solid #e0e0e0;border-radius:6px;background:#fff"><thead><tr><th class="l" style="min-width:45ch;padding:4px 12px">SKU</th><th class="l" style="text-align:right;padding:4px 12px">Qty (plan → ERP)</th></tr></thead><tbody>'+trs+'</tbody></table></div></div>'; })();
    var copyData=encodeURIComponent((lines||[]).map(function(l){return l.sku+'\t'+(Number(l.qty)||0);}).join('\n'));
    var addRowHtml=editing?'<tr class="op-addrow"><td class="l"><input class="op-add-sku" list="opsku-'+po+'" placeholder="search supplier SKU…" style="width:220px" autocomplete="off"></td><td style="text-align:right"><input class="op-add-qty" placeholder="qty" style="width:74px;text-align:right" inputmode="numeric"></td><td colspan="5" class="mut tiny">new line — added as proposed (not in ERP until you Upload)</td></tr>':'';
    var opBtns=editing
      ? '<button class="lnk-btn op-add-row" data-po="'+esc(po)+'" style="margin-left:8px">＋ Add SKU</button> <button class="save-btn op-save" data-po="'+esc(po)+'" style="margin-left:4px;background:#dcfce7;border:1px solid #16a34a;color:#166534;font-weight:700">✓ Save</button> <button class="save-btn light op-cancel">Cancel</button>'
      : '<button class="save-btn op-edit" data-po="'+esc(po)+'" style="margin-left:8px">✎ Edit qty / add SKU</button> <button class="save-btn light op-copy" data-copy="'+copyData+'" style="margin-left:4px" title="copy this PO&rsquo;s SKUs + quantities to the clipboard (tab-separated)">⧉ Copy SKU + Qty</button>';
    return '<div class="sect-h">Order plan — agree the final cost price per line '
      +'<button class="lnk-btn op-goto" data-po="'+esc(po)+'" style="margin-left:8px" title="open the full ORDER PLAN filtered to this PO">↗ open in full order plan</button>'
      +opBtns
      +'<div class="mut tiny" style="font-weight:400">supplier prices &amp; amendments flow in from the portal; ⚠ = differs from estimate / qty amended · <b>Accept</b> confirms a change · set a final price to override'+(editing?' · <b style="color:#166534">editing quantities — change values, add SKUs below, then Save</b>':'')+'</div></div>'
      +erpDevBlock
      +banner
      +'<div class="tw" style="max-width:1000px"><table style="width:max-content"><thead><tr><th class="l">SKU</th><th style="text-align:right">Qty</th><th style="text-align:right">Est. cost</th><th style="text-align:right">Supplier submitted</th><th style="text-align:right">Final price</th><th style="text-align:right">Line item total cost</th><th class="l" style="min-width:90px;white-space:nowrap">Confirm</th></tr></thead><tbody class="op-tbody">'
      +rows
      +addRowHtml
      +'<tr class="op-total" style="font-weight:700;border-top:2px solid #999"><td class="l">TOTAL</td><td style="text-align:right" class="op-totq">'+units(totQ)+'</td><td></td><td></td><td style="text-align:right">FINAL</td><td style="text-align:right" class="op-totc">$'+money(totC)+'</td><td></td></tr>'
      +'</tbody></table></div>'
      +(function(){ var addTot=0; var ar=addc.map(function(a){ var q=Number(a.qty)||0, pr=Number(a.price)||0, lt=q*pr; addTot+=lt;
          return '<tr><td class="l">'+esc(a.description||'')+'</td><td style="text-align:right">'+(a.qty!=null?units(a.qty):'')+'</td><td style="text-align:right">'+(a.price!=null?'$'+money(a.price):'')+'</td><td style="text-align:right">$'+money(lt)+'</td></tr>'; }).join('');
        var inv=totC+addTot;
        return (addc.length?'<div class="sect-h" style="margin-top:10px">Additional costs <span class="mut tiny">(supplier-entered)</span></div>'
            +'<div class="tw" style="max-width:560px"><table style="width:max-content"><thead><tr><th class="l">Description</th><th style="text-align:right">Qty</th><th style="text-align:right">Price</th><th style="text-align:right">Total</th></tr></thead><tbody>'+ar
            +'<tr style="font-weight:700;border-top:1px solid #ccc"><td class="l">Additional total</td><td></td><td></td><td style="text-align:right">$'+money(addTot)+'</td></tr></tbody></table></div>':'')
          +'<div style="margin:6px 2px 10px;font-weight:700">Total invoice cost: $'+money(inv)+' <span class="mut tiny" style="font-weight:400">(order plan $'+money(totC)+(addc.length?' + additional $'+money(addTot):'')+')</span></div>'; })()
      +'<div class="mut tiny" style="margin:2px 2px 8px">Qty shows the order plan; <b>→ N ⚠</b> = supplier-amended quantity, <b>added</b> = SKU the supplier added. <b>Accept</b> (or Accept all) confirms the supplier change and adopts their cost as the final if none is set. Confirmed agreed prices/quantities are what would be pushed to Cin7/Fulfil <span class="todo tiny">(ERP push — to build, gated)</span>.</div>'
      +(editing?'<datalist id="opsku-'+po+'"></datalist>':''); }
  // ---- TIMELINE (PO PLAN): shared note thread with the supplier; D&B posts notify the supplier portal ----
  function timelinePanel(po,d){ var notes=(d&&d.notes)||[], subs=(d&&d.subs)||[];
    function sf(s){ if(s.kind==='tracking'){ try{var o=JSON.parse(s.value);return 'tracking '+(o.tracking||'')+(o.carrier?' / '+o.carrier:'');}catch(e){return 'tracking';} }
      if(s.kind==='completion_date')return 'completion '+s.value; if(s.kind==='invoice_value')return 'invoice $'+s.value; return s.kind+' '+(s.value||''); }
    var pend=subs.filter(function(s){return s.status==='pending';}), appl=subs.filter(function(s){return s.status==='applied';});
    var head=(pend.length?'<div class="tiny" style="color:#92400e;margin-bottom:3px">⏳ Awaiting your approval: '+pend.map(function(s){return esc(sf(s));}).join(' · ')+'</div>':'')
      +(appl.length?'<div class="tiny" style="color:#166534;margin-bottom:6px">✓ Applied: '+appl.map(function(s){return esc(sf(s));}).join(' · ')+'</div>':'');
    var list=notes.length?notes.map(function(n){ var sup=(n.author_kind!=='internal');
      return '<div style="font-size:11px;margin:3px 0;padding:5px 8px;background:'+(sup?(n.read?'#f1f5f9':'#fff7ed'):'#eef2ff')+';border:1px solid '+(sup&&!n.read?'#fdba74':'#e5e7eb')+';border-radius:5px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start">'
        +'<div><span class="mut tiny">'+esc(n.created_at)+' · '+(sup?'supplier':'Dock &amp; Bay')+(n.author_email?' ('+esc(n.author_email)+')':'')+'</span>'+(sup&&!n.read?' <span class="ex-badge">new</span>':'')+'<br>'+esc(n.body)+'</div>'
        +(sup?(n.read?'<a class="note-read" data-id="'+n.id+'" data-read="1" style="flex:0 0 auto;font-size:10px;color:#64748b;cursor:pointer;text-decoration:underline;white-space:nowrap">mark unread</a>':'<button class="save-btn light note-read" data-id="'+n.id+'" data-read="0" style="flex:0 0 auto">Mark read</button>'):'')+'</div>'; }).join(''):'<div class="mut tiny">No timeline notes yet.</div>';
    var compose='<div style="margin-top:8px;display:flex;gap:6px;align-items:flex-start"><textarea class="po-note-body fci" data-po="'+esc(po)+'" rows="2" placeholder="Add a note for the supplier…" style="flex:1;min-height:34px;max-width:480px;text-align:left"></textarea><button class="save-btn po-note-post" data-po="'+esc(po)+'" style="flex:0 0 auto">Post to supplier</button></div>'
      +'<div class="mut tiny" style="margin:4px 2px">Posting appears in the supplier&rsquo;s portal timeline. Unread supplier replies show as an action.</div>';
    return '<div class="sect-h">Timeline <span class="mut tiny">— shared message thread with the supplier (their portal shows the same)</span></div>'+head+list+compose; }
  function poRefetchPanel(po,i){ var at=document.querySelector('#podet-'+i+' .potab.active'); var wantTab=at?at.dataset.pt:null;   // keep the open sub-tab after a save re-render
    fetch('/api/supply/purchase-orders').then(function(r){return r.json();}).then(function(rows){ rows.forEach(function(x){poBy[x.po]=x;}); cache['purchase-orders']=rows; loadPoDetail(po,i,wantTab); }); }
  function bindPay(po,i){
    // MASTER DATA + SHIPMENTS PLAN-panel controls (#2 / #10) — pickers + rename / delete / pallet labels for this PO
    bindCellPick(); bindShipPick(); bindShipOpen();
    function poGone(){ invalidateDerived(); delete cache['purchase-orders']; if(_poRefresh)_poRefresh(); else selectSection('purchase-orders'); }
    document.querySelectorAll('#podet-'+i+' .pom-del').forEach(function(b){ b.onclick=function(){ var p=b.dataset.po; if(!confirm('Delete PO '+p+' and all its lines? This cannot be undone.'))return;
      shipPost('/api/supply/po/'+encodeURIComponent(p)+'/delete',{},function(){ poGone(); }); }; });
    document.querySelectorAll('#podet-'+i+' .pom-unconfirm').forEach(function(b){ b.onclick=function(){ var p=b.dataset.po; if(!confirm('Reset supplier confirmation for '+p+'? They will need to re-confirm in the portal.'))return;
      shipPost('/api/supply/portal-submit',{po:p,po_confirmed:false,submitted_by:'admin'},function(){ if(poBy[p]){poBy[p].supplier_confirmed=null;poBy[p].supplier_confirmed_by='';} invalidateDerived(); poRefetchPanel(p,i); }); }; });
    document.querySelectorAll('#podet-'+i+' .pom-po').forEach(function(inp){ inp.onchange=function(){ var oldpo=inp.dataset.po, np=inp.value.trim(); if(!np||np===oldpo){inp.value=oldpo;return;} if(!confirm('Rename PO '+oldpo+' → '+np+'? Updates all its lines and references.')){inp.value=oldpo;return;}
      shipPost('/api/supply/po/'+encodeURIComponent(oldpo)+'/rename',{new_po:np},function(){ poGone(); }); }; });
    document.querySelectorAll('#podet-'+i+' .payin').forEach(function(inp){ inp.onchange=function(){
    // date payin (start/completion/balance dates): resolve any typed/pasted format → ISO, validate
    if(inp.classList.contains('dateinp')){ var _raw=(inp.value||'').trim(), _iso=_raw?parseDateLoose(_raw):''; if(_raw&&!_iso){ inp.classList.add('err'); return; } inp.classList.remove('err'); inp.value=_iso; }
    // Starting deposit can't exceed what the deposit ref still holds — clamp + roll the rest into completion.
    if(inp.dataset.field==='pay_start_deposit_assigned' && inp.dataset.avail!=null){ var av=Number(inp.dataset.avail), v=Number(String(inp.value).replace(/,/g,''));
      if(isFinite(av)&&isFinite(v)&&v>av+0.005){ inp.value=av.toFixed(2); alert('Starting deposit capped at the deposit ref’s availability ('+money(av)+'). The remainder rolls into the completion deposit.'); } }
    var body={}; body[inp.dataset.field]=String(inp.value).replace(/,/g,'').trim(); inp.classList.add('saved');   // accept pasted "1,350.91"
    // When a starting deposit amount is entered, auto-stamp today's date (only if no date set yet).
    if(inp.dataset.field==='pay_start_deposit_assigned'){ var _a=Number(String(inp.value).replace(/,/g,''));
      var _d=document.querySelector('#podet-'+i+' .payin[data-field="pay_start_deposit_date"]');
      if(_a>0 && _d && !_d.value){ body['pay_start_deposit_date']=new Date().toISOString().slice(0,10); } }
    fetch(inp.dataset.ep,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();})
      .then(function(j){ if(j&&j.error)throw new Error(j.error); invalidateDerived(); poRefetchPanel(po,i); })
      .catch(function(){ inp.classList.remove('saved'); inp.classList.add('err'); }); }; });
    document.querySelectorAll('#podet-'+i+' .po-likely').forEach(function(inp){ inp.onchange=function(){
      var raw=(inp.value||'').trim(), iso=raw?parseDateLoose(raw):''; if(raw&&!iso){ inp.classList.add('err'); return; } inp.classList.remove('err'); inp.value=iso; inp.classList.add('saved');
      fetch('/api/supply/likely-date',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({line_key:inp.dataset.key,likely_date:inp.value})}).then(function(r){return r.json();})
        .then(function(j){ if(j&&j.error)throw new Error(j.error);
          var pfx=inp.dataset.key.split(':')[0], f={dep:'likely_start',comp:'likely_completion',bal:'likely_balance_1',bal2:'likely_balance_2'}[pfx];
          if(f&&poBy[po])poBy[po][f]=inp.value||null; delete cache['cashflow']; })
        .catch(function(){ inp.classList.remove('saved'); inp.classList.add('err'); }); }; });
    // "pay »" quick-fill — record the calc amount + today's date for this milestone in one save, then refresh
    document.querySelectorAll('#podet-'+i+' .pay-fill').forEach(function(b){ b.onclick=function(){ var orig=b.innerHTML; b.disabled=true; b.textContent='…';
      var today=new Date().toISOString().slice(0,10); var body={}; body[b.dataset.af]=b.dataset.calc; body[b.dataset.df]=today;
      fetch('/api/supply/po/'+encodeURIComponent(po),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();})
        .then(function(j){ if(j&&j.error)throw new Error(j.error); invalidateDerived(); poRefetchPanel(po,i); })
        .catch(function(e){ b.disabled=false; b.innerHTML=orig; alert('Failed: '+(e.message||e)); }); }; });
    document.querySelectorAll('#podet-'+i+' .dep-pick').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); openDepPick(b.dataset.po,b,function(){ poRefetchPanel(po,i); }); }; });
    // Client/FBA file attachment upload (#12) — base64 into portal_attachments with category='client'
    document.querySelectorAll('#podet-'+i+' .cli-attach').forEach(function(inp){ inp.onchange=function(){ var f=inp.files&&inp.files[0]; if(!f)return;
      var rd=new FileReader(); rd.onload=function(){ inp.disabled=true;
        fetch('/api/supply/portal-upload',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({po:inp.dataset.po,filename:f.name,mime:f.type||'application/octet-stream',data_base64:String(rd.result),category:'client',uploaded_by:'client-tab'})})
          .then(function(r){return r.json();}).then(function(j){ if(j&&j.error)throw new Error(j.error); poRefetchPanel(po,i); })
          .catch(function(e){ inp.disabled=false; alert('Upload failed: '+(e.message||e)); }); };
      rd.readAsDataURL(f); }; });
    document.querySelectorAll('#podet-'+i+' .po-go-ship').forEach(function(b){ b.onclick=function(){ if(b.dataset.ref)gotoShipment(b.dataset.ref); }; });
    // free-text client fields — save verbatim (commas allowed) on blur
    document.querySelectorAll('#podet-'+i+' .txtin').forEach(function(inp){ inp.onchange=function(){
      if(inp.classList.contains('dateinp')){ var _r=(inp.value||'').trim(), _i=_r?parseDateLoose(_r):''; if(_r&&!_i){ inp.classList.add('err'); return; } inp.classList.remove('err'); inp.value=_i; }
      var body={}; body[inp.dataset.field]=inp.value; inp.classList.add('saved');
      fetch(inp.dataset.ep,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();})
        .then(function(j){ if(j&&j.error)throw new Error(j.error); if(poBy[po])poBy[po][inp.dataset.field]=inp.value;
          if(inp.dataset.field==='balance_due_date_overide'){ invalidateDerived(); poRefetchPanel(po,i); } })   // recompute balance due + cash flow
        .catch(function(){ inp.classList.remove('saved'); inp.classList.add('err'); }); }; });
    // Direct-to-Client tags (Key account / Custom checkboxes)
    document.querySelectorAll('#podet-'+i+' .dtc-tag').forEach(function(cb){ cb.onchange=function(){ var b={}; b[cb.dataset.field]=cb.checked;
      shipPost('/api/supply/po/'+encodeURIComponent(po),b,function(){ if(poBy[po])poBy[po][cb.dataset.field]=cb.checked; }); }; });
    // Client name — save it; if it matches a saved key account offer to pull its defaults in; if it does NOT
    // match, reveal a "Create as key account" button (isKa toggles which affordance shows).
    function mkKaToggle(){ var inp=document.querySelector('#podet-'+i+' .dtc-client'), btn=document.querySelector('#podet-'+i+' .dtc-mkka'); if(!inp||!btn)return;
      var v=(inp.value||'').trim(); var isKa=(KA_LIST||[]).some(function(k){return String(k.name||'').toLowerCase()===v.toLowerCase();});
      btn.style.display=(v && !isKa)?'':'none'; }
    fetchKeyAccounts(function(list){ var dl=document.getElementById('kalist'); if(dl)dl.innerHTML=(list||[]).map(function(k){return '<option value="'+esc(k.name)+'">';}).join(''); mkKaToggle(); });
    document.querySelectorAll('#podet-'+i+' .dtc-client').forEach(function(inp){
      inp.oninput=mkKaToggle;
      inp.onchange=function(){ var val=(inp.value||'').trim(); inp.classList.add('saved');
        shipPost('/api/supply/po/'+encodeURIComponent(po),{client:val},function(){ if(poBy[po])poBy[po].client=val; });
        mkKaToggle();
        var ka=(KA_LIST||[]).filter(function(k){return String(k.name||'').toLowerCase()===val.toLowerCase();})[0];
        if(ka && confirm('Apply "'+ka.name+'" key-account defaults to this PO?\n\nThis overwrites the current packing / labelling, client requirements and delivery address.')){
          shipPost('/api/supply/po/'+encodeURIComponent(po)+'/apply-key-account',{name:ka.name},function(j){ if(j&&j.error){alert(j.error);return;} invalidateDerived(); poRefetchPanel(po,i); }); } }; });
    document.querySelectorAll('#podet-'+i+' .dtc-mkka').forEach(function(btn){ btn.onclick=function(){ var inp=document.querySelector('#podet-'+i+' .dtc-client'); var v=(inp&&inp.value||'').trim(); if(!v){alert('Enter a client name first.');return;}
      if(!confirm('Create "'+v+'" as a key account in config, using this PO’s current packing / labelling, client requirements and delivery address?'))return;
      btn.disabled=true; shipPost('/api/supply/po/'+encodeURIComponent(po)+'/create-key-account',{},function(j){ if(j&&j.error){alert(j.error);btn.disabled=false;return;} KA_LIST=null; invalidateDerived(); poRefetchPanel(po,i); }); }; });
    // Packing & Labelling Yes/No selects (CLIENT/FBA tab) — the PLAN panel is wired by bindPay, not bindEdits,
    // so these need their own save handler (else the Yes/No never persisted).
    document.querySelectorAll('#podet-'+i+' .boolsel').forEach(function(sel){ sel.onchange=function(){ var yes=sel.value==='true';
      sel.style.background=yes?'#dcfce7':'#fee2e2'; sel.style.color=yes?'#166534':'#b91c1c'; var body={}; body[sel.dataset.field]=sel.value;
      fetch(sel.dataset.ep,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();})
        .then(function(j){ if(j&&j.error)throw new Error(j.error); if(poBy[po])poBy[po][sel.dataset.field]=yes; invalidateDerived(); })
        .catch(function(){ sel.classList.add('err'); }); }; });
    // crossdock SKU chips — add (validated against the eligible list) / remove, save comma list

  // ── Shipment DRAWER: right-side slide-in popout so a shipment can be opened/edited without leaving PURCHASE ORDERS.

  var PAY_CCY=['','GBP','EUR','AUD','USD'];
  var PTYPE_BG={Deposit:'bg-blue',Completion:'bg-amber',Balance:'bg-green',Other:'bg-neutral'};
  // ---- Xero bill export (Payments Report) ----
  function xbDmy(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||''); return m?(m[3]+'/'+m[2]+'/'+m[1]):(iso||''); }   // YYYY-MM-DD → DD/MM/YYYY
  function xbCell(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
  function fmtAmt(v){ if(v==null||v==='')return ''; var n=Number(String(v).replace(/,/g,'')); return isNaN(n)?String(v):n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  var XB_HEAD='*ContactName,EmailAddress,POAddressLine1,POAddressLine2,POAddressLine3,POAddressLine4,POCity,PORegion,POPostalCode,POCountry,*InvoiceNumber,*InvoiceDate,*DueDate,Total,InventoryItemCode,Description,*Quantity,*UnitAmount,*AccountCode,*TaxType,TaxAmount,TrackingName1,TrackingOption1,TrackingName2,TrackingOption2,Currency,*OriginalAmount';
  // One Xero bill per payment run. The download EXCLUDES "other" payments but INCLUDES them in the total used
  // to derive the FX rate: rate = bankAmount / run.total (the full payment incl. other). That rate is applied
  // to every exported line (PO completion/balance + deposit); "other" lines are then dropped from the file.
  // USD runs (no non-USD bank ccy) export at face value. liveCcy/liveAmt come from the row inputs at click
  // time, so a freshly-typed currency works without a page refresh. *OriginalAmount always keeps USD.
  function xeroBillMatrix(run, liveCcy, liveAmt){
    var out=(run.lines||[]).filter(function(l){return l.source!=='other';});   // drop "other" from the file only
    if(!out.length) return null;
    var ccy=(liveCcy && liveCcy!=='USD') ? liveCcy : 'USD';
    var altAmt=Number(String(liveAmt==null?'':liveAmt).replace(/,/g,''));
    var alt = ccy!=='USD' && altAmt>0;
    var fullTotal = Number(run.total) || (run.lines||[]).reduce(function(s,l){return s+Number(l.amount);},0);  // incl. other
    var rate = (alt && fullTotal>0) ? altAmt/fullTotal : 1;
    var inv = 'SUPPLIER-PAYMENT-'+(run.supplier_code?run.supplier_code+'-':'')+run.dt;
    var dmy = xbDmy(run.dt);
    var header=XB_HEAD.split(',');
    // round each converted line to 2dp, then push the rounding residual onto the largest line so the
    // exported total ties EXACTLY to the converted target (no 100,000.01 drift).
    var prelim=out.map(function(l){ var usd=Number(l.amount); var exact=alt?(usd*rate):usd; return { l:l, usd:usd, unit:Math.round(exact*100)/100, exact:exact }; });
    if(alt){ var target=Math.round(prelim.reduce(function(s,p){return s+p.exact;},0)*100)/100;
      var sumR=Math.round(prelim.reduce(function(s,p){return s+p.unit;},0)*100)/100;
      var resid=Math.round((target-sumR)*100)/100;
      if(resid!==0 && prelim.length){ var bi=0; for(var i=1;i<prelim.length;i++){ if(Math.abs(prelim[i].unit)>Math.abs(prelim[bi].unit)) bi=i; }
        prelim[bi].unit=Math.round((prelim[bi].unit+resid)*100)/100; } }
    var rows=prelim.map(function(p){ var l=p.l; var usd=p.usd;
      var desc=l.reference+' - '+l.type+(alt?' ('+(usd%1===0?usd:usd.toFixed(2))+' USD)':'');
      return [run.supplier,'','','','','','','','','',inv,dmy,dmy,'','',desc,'1',p.unit.toFixed(2),l.account_code||'','No VAT','','','','','',ccy,usd.toFixed(2)]; });
    return { header: header, rows: rows };
  }
  function xbToCsv(m){ return [m.header].concat(m.rows).map(function(r){return r.map(xbCell).join(',');}).join('\n')+'\n'; }
  // TAB-separated for Google Sheets. DD/MM/YYYY cells are prefixed with a leading apostrophe so Sheets keeps
  // them as literal text instead of re-parsing them to its locale date format (e.g. 25/06/2026 → 25/6/2026).
  // (The downloaded CSV is NOT apostrophe-prefixed — Xero needs the raw date.)
  function xbToTsv(m){ return [m.header].concat(m.rows).map(function(r){return r.map(function(c){ c=String(c==null?'':c).replace(/[\t\n\r]/g,' '); return /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(c)?("'"+c):c; }).join('\t');}).join('\n'); }
  function xbFilename(run){ return 'XERO_BILL_'+(run.supplier_code||run.supplier||'').replace(/[^A-Za-z0-9]+/g,'_')+'_'+run.dt+'.csv'; }
  function xbDownload(run, ccy, amt){ var m=xeroBillMatrix(run,ccy,amt); if(!m){alert('No payments in this run to export (other payments are excluded).');return;}
    var bl=new Blob([xbToCsv(m)],{type:'text/csv'}); var u=URL.createObjectURL(bl); var a=document.createElement('a'); a.href=u; a.download=xbFilename(run); document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(u);},1000); }
  function xbCopy(run, ccy, amt, btn){ var m=xeroBillMatrix(run,ccy,amt); if(!m){alert('No payments in this run to export (other payments are excluded).');return;}
    var tsv=xbToTsv(m);   // TAB-separated so it pastes into separate Google Sheets columns
    navigator.clipboard.writeText(tsv).then(function(){ if(btn){var o=btn.textContent; btn.textContent='✓'; setTimeout(function(){btn.textContent=o;},1200);} }).catch(function(){ alert('Copy failed — your browser blocked clipboard access.'); }); }
  // Payment SUMMARY copy (TAB-separated): supplier + amount + payment reference, then the full line table
  // (Reference, Amount, Type, Production ref, Deposit ref) — ALL lines incl. "other". Pastes into Sheets.
  function xbSummaryTsv(run, ccy, amt){
    var altAmt=Number(String(amt==null?'':amt).replace(/,/g,''));
    var payAmt=(ccy && ccy!=='USD' && altAmt>0) ? (fmtAmt(altAmt)+' '+ccy) : (fmtAmt(run.total)+' USD');
    var inv='SUPPLIER-PAYMENT-'+(run.supplier_code?run.supplier_code+'-':'')+run.dt;
    var clean=function(c){return String(c==null?'':c).replace(/[\t\n\r]/g,' ');};
    var out=[['SUPPLIER',run.supplier].join('\t'),['Payment amount',payAmt].join('\t'),['Payment reference',inv].join('\t'),'',
      ['REFERENCE','AMOUNT','TYPE','PRODUCTION REF','DEPOSIT REF'].join('\t')];

  // HTML version of the summary — a basic inline-styled table that pastes neatly into Gmail (and Sheets).
  function xbSummaryHtml(run, ccy, amt){

  // ---- EAN-13 barcode → inline SVG (no external lib; CSP-safe). 12-digit codes are treated as UPC-A (leading 0). ----
  function ean13Pattern(code){ code=String(code||'').replace(/\D/g,''); if(code.length===12)code='0'+code; if(code.length!==13)return null;
    var L={'0':'0001101','1':'0011001','2':'0010011','3':'0111101','4':'0100011','5':'0110001','6':'0101111','7':'0111011','8':'0110111','9':'0001011'};
    var G={'0':'0100111','1':'0110011','2':'0011011','3':'0100001','4':'0011101','5':'0111001','6':'0000101','7':'0010001','8':'0001001','9':'0010111'};
    var R={'0':'1110010','1':'1100110','2':'1101100','3':'1000010','4':'1011100','5':'1001110','6':'1010000','7':'1000100','8':'1001000','9':'1110100'};
    var par={'0':'LLLLLL','1':'LLGLGG','2':'LLGGLG','3':'LLGGGL','4':'LGLLGG','5':'LGGLLG','6':'LGGGLL','7':'LGLGLG','8':'LGLGGL','9':'LGGLGL'};
    var d=code.split(''), p=par[d[0]], bits='101', i;
    for(i=1;i<=6;i++) bits+=(p[i-1]==='L'?L:G)[d[i]];
    bits+='01010';
    for(i=7;i<=12;i++) bits+=R[d[i]];
    return bits+'101'; }

    else if(seg[0]==='demand'){ if(seg[1]&&typeof DEMAND_VIEW!=='undefined')DEMAND_VIEW=seg[1]; var _db=document.querySelector('#view-tabs-row .view-toggle[data-view="planning"]'); if(_db)_db.click(); }

    var done=function(d){
      if(rk==='metrics')return renderBIMetrics(d);

  function selectSection(key){

    if(key==='reports')return selectReport(reportTab||'metrics');
    if(REPORT_KEYS.indexOf(key)>=0)return selectReport(key);
    current=key; syncHash();
    var _tk=++_navToken;   // this navigation — a later click bumps _navToken and invalidates our async render below
    document.querySelectorAll('.stab').forEach(function(b){b.classList.toggle('active',b.dataset.k===key);});
    var _ns=document.getElementById('supply-nav-sel'); if(_ns&&_ns.value!==key)_ns.value=key;   // keep the phone section dropdown in sync
    var c=document.getElementById('supply-content'); c.innerHTML='<div class="count">Loading…</div>';
    var done=function(d){ cache[key]=d; if(_tk!==_navToken)return;   // navigated away before this resolved → don't overwrite the newer view
      if(key==='actions')return renderActions(d);
      if(key==='upcoming')return renderUpcoming(d);
      if(key==='pipeline')return renderPipeline(d);
      if(key==='purchase-orders')return renderPO(d);
      if(key==='order-plan')return renderOrderPlan(d);
      if(key==='productions')return renderProductions(d);
      if(key==='shipments')return renderShipments(d);
      if(key==='samples')return renderSamples(d);
      if(key==='flexport')return renderFlexport(d);
      if(key==='cashflow')return renderCashflow(d);
      if(key==='deposits')return renderDeposits(d);
      if(key==='barcodes')return renderBarcodes(d);
      if(key==='config')return renderConfig(d);
      renderGeneric(key,d); };
    if(cache[key])return done(cache[key]);
    fetch('/api/supply/'+key).then(function(r){return r.json();}).then(done).catch(function(e){ if(_tk!==_navToken)return; c.innerHTML='<div style="color:#dc2626">Failed to load: '+esc(e.message||e)+'</div>';}); }

  function b2bRender(last,st){ var data=last.data, co=last.co, orderDate=last.date;
    var rate=st.cur==='USD'?10:7, sym=st.cur==='USD'?'$':'£';
    var csym=(co==='US'?'$':co==='EU'?'€':co==='AU'?'A$':co==='CA'?'C$':'£'), keepW=(st.keep==null?6:st.keep);
    var tReq=0,tStock=0,tInb=0,tFul=0,tShort=0,tAir=0,tRev=0,tMar=0,nShort=0,nTight=0,nOOS=0,nOK=0,nInb=0;
    var rowsH=data.map(function(x){ var d=x.d, qty=x.qty;
      var avail=d.available||0, vel=(d.recent_units||0)/90, wt=(d.weight==null||d.weight==='')?null:Number(d.weight);
      var ws=b2bWholesale(co,d.retail);
      // cost = market COGS (3PL, final) if set; else fall back to the average PO cost price
      var cogsV=(d.cogs==null||d.cogs===''||Number(d.cogs)<=0)?null:Number(d.cogs);
      var cost=cogsV!=null?cogsV:((d.avg_cost==null||d.avg_cost==='')?null:Number(d.avg_cost));
      // SMARTER, DATE-AWARE allocation. Stock available to ship ON the required-by date =
      //   on-hand − own-channel sales between now and then + inbound landing by then.
      // Reserve keepW weeks of own-channel cover, then give from the rest; the remainder is a true shortfall.
      var daysUntil=orderDate?Math.max(0,Math.floor((new Date(orderDate+'T00:00:00')-new Date(new Date().toISOString().slice(0,10)+'T00:00:00'))/86400000)):0;
      var expSold=Math.round(vel*daysUntil);                 // own-channel units sold before the date
      var inbBy=d.inbound_by_date||0;
      var projAtDate=Math.max(0, avail - expSold + inbBy);   // stock you can actually ship on the date
      var reserve=Math.ceil(vel*7*keepW), giveable=Math.max(0, projAtDate-reserve);
      var ful=Math.min(qty,giveable), short=Math.max(0,qty-ful);
      var coverAfter=vel>0?((projAtDate-ful)/vel/7):999;
      var air=(short>0&&wt!=null)?(short*wt*rate):null;
      var rev=ws!=null?ws*qty:null, mar=(ws!=null&&cost!=null)?((ws-cost)*qty):null;
      tReq+=qty;tFul+=ful;tShort+=short; if(air)tAir+=air; if(rev)tRev+=rev; if(mar)tMar+=mar;
      var nextTxt=d.next_inbound_date?units(d.next_inbound_qty)+' '+fd(d.next_inbound_date):'';
      var rec,cls;
      if(short>0){ rec='Short '+units(short)+(air!=null?' · rush air '+sym+fmInt(air):' · need weight')+(nextTxt?' · next in '+nextTxt:''); cls='bg-red'; nShort++; }
      else if(coverAfter<2){ rec='Hold — would stock out'; cls='bg-red'; nOOS++; }
      else if(coverAfter<keepW){ rec='Caution — '+coverAfter.toFixed(0)+'wk cover left'; cls='bg-amber'; nTight++; }
      else { rec='Give ✓ — '+(coverAfter>=999?'no sales':coverAfter.toFixed(0)+'wk left'); cls='bg-green'; nOK++; }
      var availSub='now '+units(avail)+(expSold>0?' − '+units(expSold)+' sold':'')+(inbBy>0?' + '+units(inbBy)+' in':'');
      return '<tr><td class="l" style="white-space:nowrap"><b>'+esc(d.sku)+'</b></td>'
        +'<td>'+units(qty)+'</td>'
        +'<td><b>'+units(projAtDate)+'</b><br><span class="tiny mut">'+availSub+'</span>'+(d.next_inbound_date?'<br><span class="tiny mut">next '+nextTxt+'</span>':'')+'</td>'
        +'<td><span class="mut">'+units(reserve)+'</span><br><span class="tiny mut">'+keepW+'wk cover</span></td>'
        +'<td><b>'+units(ful)+'</b></td>'
        +'<td>'+(short?'<b style="color:#991b1b">'+units(short)+'</b>':'0')+'</td>'
        +'<td>'+(vel>0?coverAfter.toFixed(0)+'w':'<span class="mut tiny">no sales</span>')+'</td>'
        +'<td>'+(wt==null?'<span class="mut tiny">—</span>':wt.toFixed(2))+'</td>'
        +'<td>'+(air!=null?sym+fmInt(air):'—')+'</td>'
        +'<td>'+(ws!=null?csym+fmInt(ws):'<span class="mut tiny">no price</span>')+'</td>'
        +'<td>'+(rev!=null?csym+fmInt(rev):'—')+'</td>'
        +'<td>'+(mar!=null?csym+fmInt(mar):'<span class="mut tiny">no cost</span>')+'</td>'
        +'<td class="l"><span class="tool-badge '+cls+'">'+esc(rec)+'</span></td></tr>';
    }).join('');
    // ---- order-level verdict: take it? stock impact? worth it after air cost? ----
    var net=tMar-tAir;
    var vClass,vTitle,vBody;
    var stockNote=(nOOS?nOOS+' would stock out, ':'')+(nShort?nShort+' short, ':'')+(nTight?nTight+' thin, ':'')+nOK+' covered';
    if(nOOS>0){ vClass='bg-red'; vTitle='✗ Decline / renegotiate — stock-out risk';
      vBody='Even after reserving '+keepW+'wk cover, '+nOOS+' SKU(s) can\'t be given without stocking out your own channels. Rush a replenishment first, or trim those lines.'; }
    else if(nShort>0){
      if(tAir>0 && net>0){ vClass='bg-amber'; vTitle='⚠ Take with air-freight — worth it';
        vBody='After giving from stock (keeping '+keepW+'wk cover) and any inbound by the date, '+units(tShort)+' units are short — rush by air for ~'+sym+fmInt(tAir)+'. Net after air ≈ '+csym+fmInt(net)+' (gross '+csym+fmInt(tMar)+'). '+stockNote+'.'; }
      else if(tAir>0){ vClass='bg-red'; vTitle='✗ Decline / renegotiate — air cost too high';
        vBody='Rushing the '+units(tShort)+'-unit shortfall by air costs ~'+sym+fmInt(tAir)+', which wipes out the '+csym+fmInt(tMar)+' margin (net ≈ '+csym+fmInt(net)+'). Push the date out (more inbound lands), part-ship, or raise the price.'; }
      else { vClass='bg-amber'; vTitle='⚠ Shortfall — add weights to cost the air-freight';

      +'<b>'+esc(vTitle)+'</b><div style="font-weight:400;margin-top:3px">'+esc(vBody)+'</div></div>';
    var kpi='<div class="kpibar">'

      +'<div class="kpi"><div class="l">Fulfil by date</div><div class="v">'+units(tFul)+'</div></div>'
      +'<div class="kpi"><div class="l">Shortfall</div><div class="v"'+(tShort>0?' style="color:#991b1b"':'')+'>'+units(tShort)+'</div></div>'
      +'<div class="kpi"><div class="l">Air cost</div><div class="v">'+sym+fmInt(tAir)+'</div></div>'
      +'<div class="kpi"><div class="l">Order revenue</div><div class="v">'+csym+fmInt(tRev)+'</div></div>'
      +'<div class="kpi"><div class="l">Gross margin</div><div class="v">'+csym+fmInt(tMar)+'</div></div>'
      +'<div class="kpi"><div class="l">Net after air</div><div class="v"'+(net<0?' style="color:#991b1b"':'')+'>'+csym+fmInt(net)+'</div></div></div>';
    document.getElementById('b2b-out').innerHTML=verdict+kpi
      +'<div class="tw"><table><thead><tr><th class="l">SKU</th><th>Req</th><th>Avail @ '+(orderDate?fd(orderDate):'date')+'</th><th>Keep</th><th>Fulfil</th><th>Short</th><th>Cover after</th><th>Wt kg</th><th>Air cost</th><th>Wholesale</th><th>Revenue</th><th>Margin</th><th class="l">Recommendation</th></tr></thead><tbody>'+rowsH+'</tbody></table></div>'
      +'<div class="mut tiny" style="margin-top:4px"><b>Avail @ date</b> = on-hand today − own-channel sales between now and the required-by date + inbound landing by then (so a later date both sells down stock and lands more inbound). <b>Keep</b> = '+keepW+'wk of own-channel cover (velocity × '+keepW+'wk) held back before giving to B2B. <b>Fulfil</b> = min(requested, avail @date − keep); <b>Short</b> = the rest, rushed by air. Wholesale = 50% of ex-VAT retail (UK/EU ÷1.2). Air = short × unit weight × '+sym+rate+'/kg. Margin = (wholesale − market COGS, 3PL final; else avg PO cost) × qty; net after air in '+sym+'.</div>'; }

      var thB='position:sticky;top:0;background:#f3f3f1;z-index:1;padding:5px 8px;border-bottom:1px solid #d5d5d5;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#444;white-space:nowrap';
      box.innerHTML='<div style="flex:0 0 auto;display:flex;align-items:center;gap:10px;margin-bottom:4px"><label style="font-size:11px;cursor:pointer"><input type="checkbox" id="bp-tickall" checked> tick all</label><span class="count" id="bp-skucount" style="margin-left:auto"></span></div>'
        +'<div style="flex:1 1 auto;overflow:auto;border:1px solid #e0e0e0;border-radius:6px"><table style="border-collapse:separate;border-spacing:0;font-size:11px;width:100%">'
        +'<thead><tr><th style="'+thB+';text-align:center;width:34px"></th><th style="'+thB+';text-align:left;min-width:180px">SKU</th>'
        +'<th style="'+thB+';text-align:center;min-width:70px">Buy 3PL</th><th style="'+thB+';text-align:center;min-width:60px">Pallets</th>'
        +'<th style="'+thB+';text-align:left;min-width:160px">Supplier</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
      var ta=document.getElementById('bp-tickall'); if(ta)ta.onchange=function(){ document.querySelectorAll('#bp-skus .bp-skutick:not([disabled])').forEach(function(t){t.checked=ta.checked;}); refreshCount(); };
      box.querySelectorAll('.bp-skutick').forEach(function(t){ t.onchange=refreshCount; }); refreshCount();
    }).catch(function(e){ document.getElementById('bp-skus').innerHTML='<div style="color:#dc2626">'+esc(String(e))+'</div>'; });
    function gather(){ var out=[]; document.querySelectorAll('#bp-skus tbody tr').forEach(function(tr){ var t=tr.querySelector('.bp-skutick'); if(!t||!t.checked)return;
      var code=tr.dataset.code; var sel=tr.querySelector('.bp-skusup'); if(sel)code=sel.value;
      // include ticked rows even with no supplier — the preview flags them as "not placed" so the gap is visible
      out.push({sku:tr.dataset.sku, qty:Number(tr.dataset.qty), supplier_code:code||''}); }); return out; }
    function payload(commit){ var prod=document.getElementById('bp-prod').value;
      return {prod_no:prod, country:country, mode:mode, start_date:document.getElementById('bp-start').value||null, items:gather(), commit:!!commit}; }
    function renderPreview(d){ var r=document.getElementById('bp-result');
      if(d.error){ r.innerHTML='<div style="color:#dc2626">'+esc(d.error)+'</div>'; return; }
      var pos=d.pos||[], warn=d.warnings||[];
      var pth='position:sticky;top:0;background:#f3f3f1;z-index:1;padding:4px 8px;border-bottom:1px solid #d5d5d5;font-size:9.5px;font-weight:600;text-transform:uppercase;color:#444', ptd='padding:3px 8px;border-bottom:1px solid #f0f0f0;white-space:nowrap';
      var h='<div style="font-size:12px;margin:6px 0"><b>'+pos.length+'</b> PO(s) · target '+d.target_pallets+' pallets each · branch <b>'+esc(d.branch||'(none for '+esc(country)+' '+esc(mode.toUpperCase())+')')+'</b> · status FUTURE</div>'
        +'<table style="border-collapse:separate;border-spacing:0;font-size:11px;width:100%"><thead><tr>'
        +'<th style="'+pth+';text-align:left">PO</th><th style="'+pth+';text-align:left">Supplier</th><th style="'+pth+';text-align:center">Pallets</th><th style="'+pth+';text-align:center">SKUs</th><th style="'+pth+';text-align:center">Units</th></tr></thead><tbody>';
      pos.forEach(function(p){ var u=p.lines.reduce(function(a,b){return a+b.qty;},0);
        h+='<tr><td style="'+ptd+';text-align:left"><b>'+esc(p.po)+'</b></td><td style="'+ptd+';text-align:left">'+esc(p.supplier_code)+'</td><td style="'+ptd+';text-align:center">'+p.pallets+'</td><td style="'+ptd+';text-align:center">'+p.lines.length+'</td><td style="'+ptd+';text-align:center">'+u.toLocaleString()+'</td></tr>'; });
      h+='</tbody></table>';
      if(warn.length){ h+='<div style="font-size:11px;color:#b45309;margin-top:8px"><b>'+warn.length+' SKU(s) not placed:</b> '+warn.slice(0,25).map(function(w){return esc(w.sku)+' ('+esc(w.issue)+')';}).join(', ')+(warn.length>25?' …':'')+'</div>'; }
      r.innerHTML=h; document.getElementById('bp-create').style.display=pos.length?'':'none'; }
    document.getElementById('bp-preview').onclick=function(){ var p=payload(false); if(!p.prod_no){alert('Choose or enter a production number');return;} if(!p.items.length){alert('Tick at least one SKU (with a supplier) to include');return;}
      document.getElementById('bp-result').innerHTML='<div class="count">Working…</div>'; document.getElementById('bp-create').style.display='none';
      fetch('/api/supply/buyplan-pos',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(p)}).then(function(r){return r.json();}).then(renderPreview).catch(function(e){document.getElementById('bp-result').innerHTML='<div style="color:#dc2626">'+esc(String(e))+'</div>';}); };
    document.getElementById('bp-create').onclick=function(){ var btn=this; var p=payload(true); if(!p.prod_no)return; btn.disabled=true; btn.textContent='Creating…';
      fetch('/api/supply/buyplan-pos',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(p)}).then(function(r){return r.json();}).then(function(d){ if(d.error)throw new Error(d.error);
        close(); if(window.gotoSupplySection)window.gotoSupplySection('order-plan'); setTimeout(function(){alert('Created '+(d.created||0)+' PO(s) for '+p.prod_no+'. Review & adjust in Order Plan, then Upload to push to the ERP.');},250); })
        .catch(function(e){ btn.disabled=false; btn.textContent='Create POs'; alert('Create failed: '+(e.message||e)); }); };
  }
  window.openBuyplanModal=function(country,items,mode){ try{ buyplanModal(country,items,mode); }catch(e){ if(window.console)console.log('[SUPPLY] buyplanModal',e&&e.message); } };
  window.gotoSupplySection=function(k){ try{ showSupply(true); selectSection(k); }catch(e){ if(window.console)console.log('[SUPPLY] goto',e&&e.message); } };
  // Context help for the current SUPPLY section (reuses the ANNOT descriptions). Returns {t,h}.
  window.supplyHelpText=function(){ var sec=current||'actions'; if(sec==='reports')sec=reportTab||'upcoming'; var raw=ANNOT[sec]||'';
    var t='SUPPLY', h=raw, m=raw.match(/^<b>([^<]*)<\/b>\s*([\s\S]*)$/);
    if(m){ t=m[1].replace(/[.\s]+$/,''); h=m[2]; }
    return {t:t, h:h||'This SUPPLY section.'}; };
  function boot(){ try{ ensureRoot(); ensureNavButton(); ensureScenarioRoot(); ensureScenarioButton();
    if(!_routed){ _routed=true; try{ if(/^#\/?(supply|scenario|demand|reports|buy|fba|planning|exec)(\/|$)/.test(location.hash)) applyRoute(); }catch(e){} }   // deep-link on first load
  }catch(e){ if(window.console)console.log('[SUPPLY] boot error',e&&e.message); } }
  if(window.console)console.log('[SUPPLY] inject __APP_VERSION__ executing');
  boot(); document.addEventListener('DOMContentLoaded',boot); window.addEventListener('load',boot);
  setTimeout(boot,600); setTimeout(boot,1800); setTimeout(boot,4000);
})();
</script>
